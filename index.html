function regConfirm(){const d=APP.registration.data;return `<div class="auth-header"><div class="eyebrow">06 KONFIRMASI</div><h1 class="title" style="font-size:34px">Konfirmasi Pengajuan</h1><div class="subtitle">Tinjau data sebelum dikirim. Kata sandi login diterbitkan setelah administrator menyetujui pengajuan.</div></div><div class="card"><div class="grid grid-2"><div><div class="eyebrow">Identitas</div><h3 style="margin:7px 0">${d.name}</h3><div class="muted" style="font-size:12px">${d.email}</div></div><div><div class="eyebrow">Institusi</div><h3 style="margin:7px 0">${d.inst}</h3><div class="muted" style="font-size:12px">${d.div} · ${d.pos}</div></div></div><div class="rule"></div><div class="grid grid-3"><div><div class="k" style="font-size:9px;color:#777">FOTO</div><div style="margin-top:5px">${d.photo?'TERSEDIA':'BELUM ADA'}</div></div><div><div class="k" style="font-size:9px;color:#777">BIOMETRIK</div><div style="margin-top:5px">${APP.registration.biometric?'SELESAI':'BELUM'}</div></div><div><div class="k" style="font-size:9px;color:#777">CLEARANCE</div><div style="margin-top:5px">${d.reqClear}</div></div></div><div class="rule"></div><div class="field"><label class="field inline"><input class="check" id="decl1" type="checkbox"> <span>saya memahami kebijakan kerahasiaan dan penggunaan sistem.</span></label><label class="field inline"><input class="check" id="decl2" type="checkbox"> <span>saya memahami aktivitas akses dicatat dalam audit trail.</span></label><label class="field inline"><input class="check" id="decl3" type="checkbox"> <span>saya menyetujui proses verifikasi identitas dan perlindungan data.</span></label></div><div style="display:flex;gap:8px"><button class="btn" onclick="APP.registration.step=5;render()">KEMBALI</button><button class="btn primary" style="flex:1" onclick="submitRequest()">KIRIM PENGAJUAN</button></div></div>`}
async function submitRequest(){const d=APP.registration.data;if(!d.name||!d.dob||!d.country||!d.province||!d.city||!d.phone||!d.email){toast('Silakan lengkapi seluruh data diri wajib.','danger');APP.registration.step=1;render();return}if(!APP.registration.photoData||!APP.registration.photoConfirmed){toast('Foto identitas belum dikonfirmasi.','danger');APP.registration.step=3;render();return}if(!APP.registration.biometric){toast('Verifikasi wajah belum selesai.','danger');APP.registration.step=4;render();return}if(!document.getElementById('decl1')?.checked||!document.getElementById('decl2')?.checked||!document.getElementById('decl3')?.checked){toast('Silakan setujui seluruh pernyataan.','danger');return}const req={name:d.name,email:d.email,dob:d.dob,country:d.country,province:d.province,city:d.city,phone:d.phone,alt:d.alt||'',institution:d.inst||'',division:d.div||'',position:d.pos||'',expertise:d.expert||'',purpose:d.purpose||'',clearance:d.reqClear,scope:d.reqScope,duration:d.reqDur,sponsor:d.reqSponsor,department:d.reqDept,device:d.reqDevice,status:'PENDING',photo:APP.registration.photoData,photoConfirmed:true,biometric:true,verification:'COMPLETED',role:'Analis'};try{const out=await api('/api/requests',{method:'POST',body:JSON.stringify(req)});requests.unshift(out.request);APP.registration={step:1,photoData:null,photoConfirmed:false,biometric:false,data:{},captureStream:null};openApproval(out.request)}catch(e){toast(e.message,'danger')}}
function openApproval(req){openInfo('ACCESS REQUEST SUBMITTED',`<div class="approval-box"><div class="eyebrow">${req.id}</div><h3 style="margin:8px 0">Pengajuan telah diterima</h3><p class="muted" style="line-height:1.7">Pengajuan akses telah diterima dan sedang menunggu pemeriksaan administratif.</p><div style="margin-top:10px">${statusChip('Pending Review')}</div></div><div style="display:flex;justify-content:flex-end;margin-top:14px"><button class="btn primary" onclick="closeModal();setView('status')">CEK STATUS</button></div>`)}
function statusView(){return `<div class="view" style="min-height:100vh;display:grid;place-items:center;padding:18px"><div class="narrow"><div class="brand" style="margin-bottom:30px">${logo()}<div><div class="brand-name">IKSN — CEK STATUS PENGAJUAN</div><div class="brand-sub">Request Tracking</div></div></div><div class="card"><div class="eyebrow">CHECK REQUEST STATUS</div><h1 class="title" style="font-size:38px">Status Pengajuan</h1><div class="field"><label class="label">Email atau Request ID</label><input class="input" id="statusKey" placeholder="email@... atau REQ-00291"></div><button class="btn primary block" onclick="checkStatus()">CEK STATUS</button><div id="statusResult" style="margin-top:16px"></div></div><button class="mini-link" style="margin-top:10px" onclick="setView('welcome')">← Kembali</button></div></div>`}
async function checkStatus(){const key=(document.getElementById('statusKey')?.value||'').trim();const el=document.getElementById('statusResult');if(!key){el.innerHTML='<div class=\"notice danger\"><b>DATA BELUM DIISI</b><p>Masukkan Email atau Request ID.</p></div>';return}try{const d=await api('/api/requests/status?key='+encodeURIComponent(key));const r=d.request;if(r.status==='PENDING'||r.status==='INFO_REQUESTED')el.innerHTML=`<div class=\"notice\"><b>Status: ${r.status==='PENDING'?'Menunggu Tinjauan Administratif':'Memerlukan Informasi Tambahan'}</b><p>Pengajuan <b>${esc(r.id)}</b> belum memiliki akses aktif.</p></div>`;else if(r.status==='REJECTED'||r.status==='TERMINATED')el.innerHTML=`<div class=\"notice danger\"><b>ACCESS DENIED</b><p>Pengajuan ${esc(r.id)} tidak memiliki akses aktif.</p></div>`;else el.innerHTML=`<div class=\"notice success\"><b>ACCESS APPROVED</b><p>Status: Disetujui.</p><div class=\"grid grid-3\" style=\"margin-top:12px\"><div class=\"card soft\"><div class=\"eyebrow\">OTP CODE</div><div style=\"font-size:24px;font-weight:800;margin-top:6px\">${esc(String(r.otp||''))}</div></div><div class=\"card soft\"><div class=\"eyebrow\">SERIAL NUMBER</div><div style=\"margin-top:6px;word-break:break-all\">${esc(String(r.serial||''))}</div></div><div class=\"card soft\"><div class=\"eyebrow\">PASSWORD</div><div style=\"margin-top:6px;word-break:break-word\">${esc(String(r.loginPassword||''))}</div></div></div></div>`}catch(e){el.innerHTML=`<div class=\"notice danger\"><b>DATA TIDAK DITEMUKAN</b><p>${esc(e.message)}</p></div>`}}
function adminLoginView(){const step=APP.adminAuth.step;const names=['Kredensial','OTP','Perangkat','Biometrik','Konfirmasi'];return `<div class="auth-shell view"><aside class="auth-aside"><div><div class="brand">${logo()}<div><div class="brand-name">IKSN ADMIN</div><div class="brand-sub">Privileged Console</div></div></div><div style="margin-top:42px"><div class="eyebrow">PRIVILEGED ACCESS ENVIRONMENT</div><h2 style="font-size:28px">Administrative Security Console</h2><p class="muted" style="font-size:12px;line-height:1.7">Akses administrator dilindungi autentikasi berlapis, pemeriksaan perangkat, verifikasi wajah, pembatasan percobaan, dan audit aktivitas.</p><div class="admin-security-list"><div class="admin-security-row"><span class="n">01</span><span>Kredensial administrator</span></div><div class="admin-security-row"><span class="n">02</span><span>One-time verification code</span></div><div class="admin-security-row"><span class="n">03</span><span>Trusted device check</span></div><div class="admin-security-row"><span class="n">04</span><span>Face verification</span></div><div class="admin-security-row"><span class="n">05</span><span>Privileged session confirmation</span></div></div></div></div><div class="muted" style="font-size:10px">HIGH-PRIVILEGE ACCOUNT · MONITORED</div></aside><main class="auth-main"><div class="auth-box"><div class="auth-top"><button class="mini-link" onclick="cancelAdminLogin()">← Kembali</button><div class="stepper">${names.map((n,i)=>`<div class="step ${step===i+1?'active':''} ${step>i+1?'done':''}"><span class="n">${step>i+1?'✓':i+1}</span>${n}</div>`).join('')}</div></div>${adminAuthBody()}</div></main></div>`}
function cancelAdminLogin(){stopCameraStream();APP.adminAuth={step:1,email:'',lockedUntil:0,failures:0,otpFailures:0,otpLockedUntil:0,device:false,biometric:false};APP.authMode='user';setView('welcome')}
function openAdminPortal(){stopCameraStream();APP.authMode='admin';APP.authStep=1;APP.adminAuth={step:1,email:'',lockedUntil:0,failures:0,otpFailures:0,otpLockedUntil:0,device:false,biometric:false};setView('adminLogin')}
function adminAuthBody(){const step=APP.adminAuth.step;if(step===1)return adminCredentialStep();if(step===2)return adminOtpStep();if(step===3)return adminDeviceStep();if(step===4)return adminFaceStep();return adminConfirmStep()}
function adminCredentialStep(){return `${authHeader('Privileged Login','Masukkan kredensial administrator. Sistem tidak mengisi akun secara otomatis untuk mencegah kredensial tampil saat portal dibuka.')}<div class="card admin-security-card"><div class="field"><label class="label" for="adminId">Administrator ID / Email</label><input class="input" id="adminId" type="email" autocomplete="username" placeholder="admin-xxx@iksn.local"></div><div class="field"><label class="label" for="adminPass">Password</label><div class="password-wrap"><input class="input" id="adminPass" type="password" autocomplete="current-password" placeholder="Masukkan password administrator"><button type="button" class="password-toggle" onclick="togglePassword('adminPass')">Lihat</button></div></div><div class="notice">Akses administrator memiliki pembatasan percobaan. Setelah beberapa kegagalan, proses login akan dikunci sementara.</div><button class="btn primary block" onclick="verifyAdminCredentials()">LANJUTKAN</button></div><div class="admin-auth-note" style="margin-top:12px">Jangan membagikan kredensial administrator. Pada implementasi produksi, gunakan password manager, MFA, WebAuthn/passkey, dan validasi server-side.</div>`}
async function verifyAdminCredentials(){const email=(document.getElementById('adminId')?.value||'').trim().toLowerCase();const pass=document.getElementById('adminPass')?.value||'';if(!email||!pass){toast('Masukkan email dan password administrator.','danger');return}try{const d=await api('/api/auth/admin/credentials',{method:'POST',body:JSON.stringify({email,password:pass})});APP.adminAuth.email=email;APP.adminAuth.step=2;render();if(d.otpPreview)toast('OTP testing: '+d.otpPreview,'info')}catch(e){toast(e.message,'danger')}}
function adminOtpStep(){return `${authHeader('One-Time Verification','Masukkan kode OTP enam digit yang dikirim melalui kanal institusional administrator.')}<div class="card admin-security-card"><div class="field"><label class="label">Kode OTP</label><div class="admin-auth-code" id="adminOtpBox">${Array.from({length:6},(_,i)=>`<input maxlength="1" inputmode="numeric" pattern="[0-9]*" aria-label="Digit OTP ${i+1}" id="aotp${i}" ${i===0?'autofocus':''}>`).join('')}</div></div><div class="notice">Kode berlaku untuk sesi autentikasi ini. Jangan teruskan kode OTP kepada pihak lain.</div><button class="btn primary block" onclick="verifyAdminOtp()">VERIFIKASI OTP</button></div><div class="admin-auth-note" style="margin-top:12px">Prototype menggunakan kanal OTP simulasi. Sistem produksi harus mengirim OTP melalui provider autentikasi yang aman dan menerapkan expiry serta replay protection.</div>`}
async function verifyAdminOtp(){const otp=[0,1,2,3,4,5].map(i=>(document.getElementById('aotp'+i)?.value||'').trim()).join('');if(!/^\d{6}$/.test(otp)){toast('Masukkan OTP 6 digit.','danger');return}try{await api('/api/auth/admin/otp',{method:'POST',body:JSON.stringify({email:APP.adminAuth.email,otp})});APP.adminAuth.step=3;render()}catch(e){toast(e.message,'danger')}}
function adminDeviceStep(){const ua=navigator.userAgent||'';const mobile=/Android|iPhone|iPad/i.test(ua);return `${authHeader('Trusted Device Check','Periksa perangkat yang sedang digunakan sebelum hak istimewa administrator diberikan.')}<div class="device-check"><div class="card"><div class="eyebrow">CURRENT DEVICE</div><h3 style="margin:8px 0">${mobile?'Perangkat Seluler':'Workstation'}</h3><div class="status-list"><div class="status-row"><span>Platform</span><b>${/Android/i.test(ua)?'Android':/Mac/i.test(ua)?'macOS':/Win/i.test(ua)?'Windows':'Browser'}</b></div><div class="status-row"><span>Browser</span><b>${/Chrome/i.test(ua)?'Chrome':/Safari/i.test(ua)?'Safari':'Modern Browser'}</b></div><div class="status-row"><span>Connection</span><b>${location.protocol==='https:'||['localhost','127.0.0.1'].includes(location.hostname)?'SECURE CONTEXT':'LOCAL FILE / LIMITED'}</b></div></div></div><div class="card"><div class="eyebrow">DEVICE TRUST</div><p class="muted" style="font-size:12px;line-height:1.6">Konfirmasi bahwa perangkat ini memang perangkat yang Anda gunakan untuk akses administratif.</p><label class="field inline"><input class="check" id="adminDeviceTrust" type="checkbox"> <span style="font-size:12px">Saya mengonfirmasi perangkat ini tepercaya.</span></label><div class="notice" style="margin:12px 0">Untuk produksi, gunakan device binding, WebAuthn/passkey, attestation, dan server-side session controls.</div><button class="btn primary block" onclick="verifyAdminDevice()">KONFIRMASI PERANGKAT</button></div></div>`}
function verifyAdminDevice(){if(!document.getElementById('adminDeviceTrust')?.checked){toast('Konfirmasi perangkat diperlukan.','danger');return}APP.adminAuth.device=true;APP.adminAuth.step=4;addAudit('ADMIN-GATE','TRUSTED DEVICE CHECK','ADMIN-001','SUCCESS','PRIVILEGED LOGIN');render()}
function adminFaceStep(){return `${authHeader('Admin Face Verification','Verifikasi wajah diperlukan sebelum sesi berprivilege dapat dibuka.')}<div class="card"><div id="cameraStateArea">${cameraPermissionIntro('admin')}</div></div><div class="notice" style="margin-top:12px">Kamera nyata digunakan melalui izin browser. Pencocokan biometrik pada prototype tetap disimulasikan dan tidak boleh dianggap sebagai sistem identitas produksi.</div>`}
function adminConfirmStep(){return `${authHeader('Privileged Session Confirmation','Konfirmasi terakhir sebelum console administrator dibuka.')}<div class="card admin-security-card"><div class="grid grid-2"><div class="stat"><div class="k">Identity</div><div class="v" style="font-size:17px">VERIFIED</div><div class="s">Administrator credential + OTP</div></div><div class="stat"><div class="k">Device</div><div class="v" style="font-size:17px">TRUSTED</div><div class="s">Device check passed</div></div><div class="stat"><div class="k">Biometric</div><div class="v" style="font-size:17px">VERIFIED</div><div class="s">Face verification completed</div></div><div class="stat"><div class="k">Monitoring</div><div class="v" style="font-size:17px">ENABLED</div><div class="s">Privileged activity is audited</div></div></div><div class="rule"></div><label class="field inline"><input class="check" id="adminFinalConfirm" type="checkbox"> <span style="font-size:12px">Saya memahami bahwa aktivitas administrator dicatat dan akses berprivilege hanya digunakan untuk tugas yang diotorisasi.</span></label><button class="btn primary block" onclick="completeAdminLogin()">BUKA ADMIN CONSOLE</button></div>`}
async function completeAdminLogin(){if(!document.getElementById('adminFinalConfirm')?.checked){toast('Konfirmasi sesi administrator diperlukan.','danger');return}try{const d=await api('/api/auth/admin/session',{method:'POST',body:'{}'});APP.adminAuth.step=5;APP.adminAuthed=true;APP.authMode='admin';APP.currentSection='admin-overview';APP.session={expiresAt:Number(d.expiresAt),active:true};startSessionRefresh();addAudit('ADMIN-001','PRIVILEGED SESSION OPENED','ADMIN-CONSOLE','SUCCESS','ADMIN CONSOLE');setView('admin')}catch(e){toast(e.message,'danger')}}
function adminView(){return `<div class="view"><div class="shell"><aside class="sidebar" id="adminSidebar"><div class="brand">${logo()}<div><div class="brand-name">IKSN ADMIN</div><div class="brand-sub">Privileged Console</div></div></div><nav class="side-nav"><div class="admin-sidebar-section"><div class="admin-sidebar-title">Ringkasan</div>${adminNav('overview','Dashboard Admin','grid')}${adminNav('analytics','Analitik Institusional','chart')}</div><div class="admin-sidebar-section"><div class="admin-sidebar-title">Personel & Akses</div>${adminNav('requests','Pengajuan Masuk','file')}${adminNav('allpersonnel','Semua Personel','people')}${adminNav('credentials','Manajemen Kredensial','lock')}${adminNav('roles','Role & Clearance','shield')}${adminNav('access','Access Control','settings')}</div><div class="admin-sidebar-section"><div class="admin-sidebar-title">Arsip & Intelligence</div>${adminNav('profiles','Profil Strategis','people')}${adminNav('documents','Arsip Dokumen','doc')}${adminNav('radar','Tactical Radar / Posisi Personel','map')}</div><div class="admin-sidebar-section"><div class="admin-sidebar-title">Keamanan</div>${adminNav('devices','Device & Sessions','settings')}${adminNav('security','Security Alerts','bell')}${adminNav('audit','Audit Trail','file')}</div><div class="admin-sidebar-section"><div class="admin-sidebar-title">Tata Kelola Sistem</div>${adminNav('policies','Kebijakan & Retensi','settings')}${adminNav('classifications','Klasifikasi','shield')}${adminNav('system','System Status','grid')}</div></nav><div class="sidebar-footer">ADMIN PRIVILEGE<br>Enhanced monitoring enabled.<br><span style="color:#8d6b43">5-LAYER AUTHENTICATION</span><br><span style="font-size:8px;letter-spacing:.13em;color:#4f4b46">NODE HAYDAR-S/07</span></div></aside><main class="main"><header class="topbar"><div class="top-actions"><button class="mobile-menu" onclick="document.getElementById('adminSidebar').classList.toggle('open')">${icon('menu')}</button><div class="eyebrow">ADMINISTRATIVE SECURITY CONSOLE</div></div><div class="top-actions"><span class="chip danger">HIGH-PRIVILEGE</span><span class="chip success">MFA VERIFIED</span><button class="btn small" onclick="adminLogout()">${icon('logout')} Logout</button></div></header><div class="page">${adminContent()}</div></main></div></div>`}
async function adminLogout(){stopCameraStream();try{await api('/api/auth/logout',{method:'POST',body:'{}'})}catch(_){}clearInterval(APP.sessionRefreshTimer);APP.sessionRefreshTimer=null;APP.adminAuthed=false;APP.adminAuth={step:1,email:'',lockedUntil:0,failures:0,otpFailures:0,otpLockedUntil:0,device:false,biometric:false};APP.session.active=false;setView('welcome')}
function adminNav(id,label,ic){const pending=id==='requests'?requests.filter(r=>r.status==='PENDING').length:0;return `<button class="nav-btn ${getAdminSection()===id?'active':''}" onclick="navAdmin('${id}')">${icon(ic)}<span>${label}</span>${pending?`<span class="chip warning" style="margin-left:auto;padding:3px 6px">${pending}</span>`:''}</button>`}
function getAdminSection(){return APP.currentSection.startsWith('admin-')?APP.currentSection.slice(6):'overview'}
function navAdmin(id){APP.currentSection='admin-'+id;render();closeSidebar()}
function adminContent(){const s=getAdminSection();if(s==='requests')return adminRequests();if(s==='allpersonnel')return adminAllPersonnel();if(s==='credentials')return adminCredentials();if(s==='roles')return adminRoles();if(s==='access')return adminAccessControl();if(s==='profiles')return dataSection('Profil Strategis','profiles',profiles);if(s==='documents')return dataSection('Arsip Dokumen','documents',documents);if(s==='analytics')return analytics();if(s==='radar')return adminRadar();if(s==='devices')return adminDevices();if(s==='security')return adminSecurity();if(s==='audit')return auditView(true);if(s==='policies')return adminPolicies();if(s==='classifications')return adminClassifications();if(s==='system')return adminSystemStatus();return adminOverview()}
function adminCredentials(){return `<div class="page-head"><div><div class="eyebrow">PERSONEL & AKSES</div><h1 class="title" style="font-size:34px">Manajemen Kredensial</h1><div class="subtitle">Kontrol penerbitan, rotasi, dan status kredensial akun. Nilai sensitif tidak ditampilkan di dashboard.</div></div></div><div class="grid grid-3"><div class="card stat"><div class="k">Akun Aktif</div><div class="v">${personnel.filter(x=>x.status==='Active').length}</div><div class="s">credential enabled</div></div><div class="card stat"><div class="k">Akun Suspended</div><div class="v">${personnel.filter(x=>x.status==='Suspended').length}</div><div class="s">requires review</div></div><div class="card stat"><div class="k">MFA Policy</div><div class="v" style="font-size:20px">ENFORCED</div><div class="s">admin sessions</div></div></div><div class="card" style="margin-top:16px"><div class="eyebrow">CREDENTIAL POLICY</div><div class="grid grid-2" style="margin-top:12px"><div class="notice success">Password tidak ditampilkan kembali setelah diterbitkan.</div><div class="notice">Rotasi kredensial dan revocation harus dilakukan server-side pada implementasi produksi.</div></div></div>`}
function adminRoles(){return `<div class="page-head"><div><div class="eyebrow">PERSONEL & AKSES</div><h1 class="title" style="font-size:34px">Role & Clearance</h1><div class="subtitle">Matriks fiktif untuk pemetaan peran, clearance, dan ruang lingkup akses.</div></div></div><div class="grid grid-auto">${roles.map((r,i)=>`<div class="card"><div class="eyebrow">ROLE ${String(i+1).padStart(2,'0')}</div><h3 style="font-size:18px;margin:8px 0">${r}</h3><div class="muted" style="font-size:11px;line-height:1.6">Akses berbasis kebutuhan tugas, clearance, dan status akun.</div><div style="margin-top:12px">${levelChip(LEVELS[Math.min(i+1,3)])}</div></div>`).join('')}</div>`}
function adminAccessControl(){return `<div class="page-head"><div><div class="eyebrow">PERSONEL & AKSES</div><h1 class="title" style="font-size:34px">Access Control</h1><div class="subtitle">Pemeriksaan kebijakan akses sebelum record sensitif dibuka.</div></div></div><div class="grid grid-2"><div class="card"><div class="eyebrow">ENFORCEMENT</div>${[['RBAC','AKTIF'],['Clearance Check','AKTIF'],['Session Expiry','10 MENIT'],['Audit Logging','AKTIF'],['Rate Limiting','AKTIF']].map(x=>`<div class="status-row"><span>${x[0]}</span><b>${statusChip(x[1])}</b></div>`).join('')}</div><div class="card"><div class="eyebrow">DENIAL POLICY</div><div class="notice danger" style="margin-top:10px">Record di atas clearance akun akan ditolak. Administrator tetap harus mematuhi role dan audit policy.</div><div class="notice" style="margin-top:10px">Prototype ini tidak menggantikan authorization server produksi.</div></div></div>`}
function adminDevices(){return `<div class="page-head"><div><div class="eyebrow">KEAMANAN</div><h1 class="title" style="font-size:34px">Device & Sessions</h1><div class="subtitle">Ringkasan sesi berprivilege dan status perangkat yang telah melewati pemeriksaan.</div></div></div><div class="grid grid-3"><div class="card stat"><div class="k">Admin Sessions</div><div class="v">1</div><div class="s">current privileged session</div></div><div class="card stat"><div class="k">Device Trust</div><div class="v" style="font-size:20px">VERIFIED</div><div class="s">current device</div></div><div class="card stat"><div class="k">Session TTL</div><div class="v" style="font-size:20px">10 MIN</div><div class="s">automatic expiry</div></div></div><div class="card" style="margin-top:16px"><div class="eyebrow">CURRENT SESSION</div><div class="status-list" style="margin-top:8px"><div class="status-row"><span>Administrator</span><b>ADMIN-001</b></div><div class="status-row"><span>Authentication</span><b>${statusChip('MFA VERIFIED')}</b></div><div class="status-row"><span>Face Verification</span><b>${statusChip('VERIFIED')}</b></div><div class="status-row"><span>Session Status</span><b>${statusChip('ACTIVE')}</b></div></div></div>`}
function adminSystemStatus(){return `<div class="page-head"><div><div class="eyebrow">TATA KELOLA SISTEM</div><h1 class="title" style="font-size:34px">System Status</h1><div class="subtitle">Status komponen prototype dan kontrol yang direkomendasikan untuk lingkungan produksi.</div></div></div><div class="grid grid-auto">${[['Archive UI','OPERATIONAL'],['Authentication Gate','5-LAYER'],['Audit Trail','ENABLED'],['Location Sync','SERVER GPS FEED'],['Session Control','ENFORCED'],['Data Classification','ENFORCED'],['Backend','CONNECTED']].map(x=>`<div class="card"><div class="eyebrow">${x[0]}</div><div style="font-size:18px;font-weight:800;margin-top:8px">${x[1]}</div><div class="muted" style="font-size:10px;margin-top:5px">Prototype status</div></div>`).join('')}</div><div class="notice" style="margin-top:16px">Frontend terhubung ke backend untuk session, approval, audit, credential issuance, dan sinkronisasi lokasi. Verifikasi biometrik tetap berupa pemeriksaan visual prototype.</div>`}
function adminOverview(){const pending=requests.filter(r=>r.status==='PENDING').length;return `<div class="page-head"><div><div class="eyebrow">ADMINISTRATIVE OVERVIEW</div><h1 class="title" style="font-size:34px">Pusat Administrasi</h1><div class="subtitle">Pantau personel, pengajuan, sesi, clearance, dan peristiwa keamanan dari lingkungan berprivilege.</div></div></div><div class="grid grid-4">${[['Total Personel',personnel.length,'database'],['Pengajuan Baru',pending,'menunggu review'],['Sesi Aktif',18,'estimasi demo'],['Akun Ditangguhkan',personnel.filter(x=>x.status==='Suspended').length,'monitoring']].map(x=>`<div class="card stat"><div class="k">${x[0]}</div><div class="v">${x[1]}</div><div class="s">${x[2]}</div></div>`).join('')}</div><div class="grid grid-2" style="margin-top:16px"><div class="card"><div class="page-head" style="margin-bottom:14px"><div><div class="eyebrow">PENGAJUAN</div><h3 class="section-title">Antrian Terbaru</h3></div><button class="btn small" onclick="navAdmin('requests')">Buka semua</button></div>${requests.slice(0,5).map(r=>`<div class="person-card clickable" onclick="openRequestReview('${r.id}')"><div class="p-avatar"><img src="${r.photo||fakePhoto(r.name,7)}"></div><div><div class="name">${r.name}</div><div class="meta">${r.id} · ${r.institution||'-'}</div></div><div>${statusChip(r.status==='PENDING'?'Pending Review':r.status)}</div></div>`).join('')}</div><div class="card"><div class="page-head" style="margin-bottom:14px"><div><div class="eyebrow">SECURITY</div><h3 class="section-title">Peristiwa Terakhir</h3></div><button class="btn small" onclick="navAdmin('audit')">Audit trail</button></div>${securityEvents.slice(0,6).map(e=>`<div style="padding:9px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;font-size:11px"><div><b>${e.action}</b><div class="muted">${e.user} · ${e.record}</div></div><div>${statusChip(e.result)}</div></div>`).join('')}</div></div><div class="footer"><div class="footer-row"><span>PROTOTYPE ENVIRONMENT — ALL RECORDS ARE FICTIONAL</span><span>ADMIN PRIVILEGE AUDIT ENABLED</span></div></div>`}
function adminRequests(){const pending=requests.filter(r=>r.status==='PENDING').length;return `<div class="page-head"><div><div class="eyebrow">PERSONEL</div><h1 class="title" style="font-size:34px">Pengajuan Masuk</h1><div class="subtitle">Daftar seluruh pengajuan personel. Buka tiket untuk melihat data pribadi, institusi, foto identitas, verifikasi, klasifikasi operasional, lalu menentukan keputusan.</div></div><div class="actions"><span class="chip warning">${pending} MENUNGGU REVIEW</span></div></div><div class="card"><div class="toolbar"><input class="input grow" placeholder="Cari nama, email, request ID..." oninput="renderAdminRequests(this.value)" id="reqSearch"><span class="chip neutral">${requests.length} TOTAL</span></div><div id="requestList">${renderRequestList('')}</div></div>`}
function renderAdminRequests(q){document.getElementById('requestList').innerHTML=renderRequestList(q)}
function renderRequestList(q){const arr=requests.filter(r=>`${r.name} ${r.email} ${r.id} ${r.institution}`.toLowerCase().includes(q.toLowerCase()));return arr.map(r=>`<div class="person-card clickable" style="margin-bottom:9px" onclick="openRequestReview('${r.id}')"><div class="p-avatar"><img src="${r.photo||fakePhoto(r.name,7)}"></div><div><div class="name">${r.name}</div><div class="meta">${r.id} · ${r.email}</div><div class="meta">${r.institution||'-'} · ${r.position||'-'}</div></div><div style="text-align:right">${statusChip(r.status==='PENDING'?'Pending Review':r.status)}<div class="meta" style="margin-top:5px">${r.clearance||'-'}</div></div></div>`).join('')||'<div class="muted">Tidak ada hasil.</div>'}
function openRequestReview(id){APP.admin.selectedRequest=id;const r=requests.find(x=>x.id===id);if(!r)return;addAudit('ADMIN-001','OPEN ACCESS REQUEST',id);openModal('ACCESS REQUEST REVIEW',`<div class="review-grid"><div><div class="eyebrow">FOTO IDENTITAS</div><div class="review-photo" style="margin-top:8px"><img id="reviewImg" src="${r.photo||fakePhoto(r.name,8)}" alt="Foto ${r.name}" onclick="openPhotoViewer('${r.id}')"></div><div style="margin-top:8px;text-align:center"><button class="btn small" onclick="openPhotoViewer('${r.id}')">LIHAT FOTO</button></div></div><div><div class="eyebrow">DATA PRIBADI</div><div class="detail-meta"><div class="meta-box"><div class="k">Nama Lengkap</div><div class="v">${r.name}</div></div><div class="meta-box"><div class="k">Tanggal Lahir</div><div class="v">${r.dob||'Tidak dicantumkan'}</div></div><div class="meta-box"><div class="k">Nomor Telepon</div><div class="v">${r.phone||'—'}</div></div><div class="meta-box"><div class="k">Email</div><div class="v">${r.email}</div></div><div class="meta-box"><div class="k">Institusi</div><div class="v">${r.institution}</div></div><div class="meta-box"><div class="k">Divisi</div><div class="v">${r.division}</div></div><div class="meta-box"><div class="k">Jabatan</div><div class="v">${r.position}</div></div><div class="meta-box"><div class="k">Bidang Keahlian</div><div class="v">${r.expertise||'-'}</div></div></div><div class="rule"></div><div class="eyebrow">SECURITY REQUEST</div><div class="detail-meta"><div class="meta-box"><div class="k">Requested Clearance</div><div class="v">${levelChip(r.clearance)}</div></div><div class="meta-box"><div class="k">Access Scope</div><div class="v">${r.scope||'-'}</div></div><div class="meta-box"><div class="k">Sponsor</div><div class="v">${r.sponsor||'-'}</div></div><div class="meta-box"><div class="k">Duration</div><div class="v">${r.duration||'-'}</div></div></div><div class="rule"></div><div class="eyebrow">VERIFICATION</div><div class="grid grid-2" style="margin-top:9px"><div class="notice success">Email: <b>VERIFIED</b></div><div class="notice success">Photo: <b>RECEIVED</b></div><div class="notice success">Face Verification: <b>COMPLETED</b></div><div class="notice">Device: <b>${r.device==='VERIFIED'?'VERIFIED':'PENDING'}</b></div></div><div class="rule"></div><div class="eyebrow">TENTUKAN KLASIFIKASI OPERASIONAL</div><select class="select" id="roleAssign" style="margin-top:8px">${roles.map(x=>`<option ${r.role===x?'selected':''}>${x}</option>`).join('')}</select><div class="help">Klasifikasi ini adalah label fiktif untuk pembagian akses internal pada prototype.</div><div class="review-actions"><button class="btn primary" onclick="approveRequest('${r.id}')">APPROVE REQUEST</button><button class="btn" onclick="requestMoreInfo('${r.id}')">REQUEST ADDITIONAL INFORMATION</button><button class="btn danger" onclick="rejectRequest('${r.id}')">REJECT REQUEST</button></div></div></div><div class="footer" style="margin-top:20px"><div class="notice">Foto identitas merupakan bagian dari data profil terbatas. Akses terhadap data ini dicatat dalam audit trail dan hanya tersedia bagi administrator dengan kewenangan yang sesuai.</div></div>`,{eyebrow:'PRIVILEGED REVIEW'})}
async function terminatePersonnel(target){const p=personnel.find(x=>x.id===target);if(!p)return;if(!confirm(`Cabut akses / pecat ${p.name}?`))return;try{const d=await api('/api/admin/personnel/'+encodeURIComponent(target)+'/terminate',{method:'POST'});Object.assign(p,d.personnel);const r=requests.find(x=>x.personnelId===target);if(r&&d.request)Object.assign(r,d.request);closeModal();toast(`${p.name} telah dinonaktifkan dan akses dicabut.`,'success');render()}catch(e){toast(e.message,'danger')}}
async function deletePersonnelData(target){const p=personnel.find(x=>x.id===target);if(!p)return;if(!confirm(`Hapus data ${p.name} dari sistem?`))return;try{await api('/api/admin/personnel/'+encodeURIComponent(target)+'/delete',{method:'POST'});for(let i=personnel.length-1;i>=0;i--)if(personnel[i].id===target)personnel.splice(i,1);for(let i=requests.length-1;i>=0;i--)if(requests[i].personnelId===target)requests.splice(i,1);closeModal();toast(`Data ${p.name} telah dihapus.`,'success');render()}catch(e){toast(e.message,'danger')}}
function openPhotoViewer(id){const r=requests.find(x=>x.id===id)||personnel.find(x=>x.id===id);if(!r)return;addAudit('ADMIN-001','VIEW PROFILE PHOTO',id);openModal('ADMIN PHOTO VIEWER',`<div style="display:grid;grid-template-columns:minmax(240px,420px) 1fr;gap:20px;align-items:start"><div class="review-photo"><img src="${r.photo||fakePhoto(r.name,4)}" alt="Foto ${r.name}"></div><div class="stack"><div class="meta-box"><div class="k">Nama</div><div class="v">${r.name}</div></div><div class="meta-box"><div class="k">Personnel ID</div><div class="v">${r.id||'—'}</div></div><div class="meta-box"><div class="k">Photo Status</div><div class="v">RECEIVED</div></div><div class="meta-box"><div class="k">Uploaded Date</div><div class="v">${r.submitted||'2026-09-02'}</div></div><div class="meta-box"><div class="k">Verification</div><div class="v">COMPLETED</div></div></div><div style="text-align:right"><button class="btn" onclick="closeModal();openRequestReview('${id}')">CLOSE</button></div></div></div>`,{eyebrow:'PROFILE PHOTO'})}
async function approveRequest(id){const role=document.getElementById('roleAssign')?.value||'Analis';try{const d=await api('/api/admin/requests/'+encodeURIComponent(id)+'/approve',{method:'POST',body:JSON.stringify({role})});const old=requests.find(x=>x.id===id);if(old)Object.assign(old,d.request);else requests.unshift(d.request);if(d.personnel){const i=personnel.findIndex(p=>p.id===d.personnel.id);if(i>=0)personnel[i]=d.personnel;else personnel.push(d.personnel)}closeModal();toast(`Pengajuan ${id} disetujui.`,'success');render()}catch(e){toast(e.message,'danger')}}
async function requestMoreInfo(id){try{const d=await api('/api/admin/requests/'+encodeURIComponent(id)+'/info',{method:'POST'});const r=requests.find(x=>x.id===id);if(r)Object.assign(r,d.request);closeModal();toast('Permintaan informasi tambahan dicatat.','success');render()}catch(e){toast(e.message,'danger')}}
async function rejectRequest(id){try{const d=await api('/api/admin/requests/'+encodeURIComponent(id)+'/reject',{method:'POST'});const r=requests.find(x=>x.id===id);if(r)Object.assign(r,d.request);closeModal();toast(`Pengajuan ${id} ditolak.`,'danger');render()}catch(e){toast(e.message,'danger')}}
function adminAllPersonnel(){APP.search.type='personnel';return `<div class="page-head"><div><div class="eyebrow">DATABASE</div><h1 class="title" style="font-size:34px">Semua Personel</h1><div class="subtitle">Profil personel, clearance, status, foto, dan klasifikasi operasional.</div></div></div>${dataTable(personnel,'personnel',true)}`}
async function loadAdminLocations(){try{const d=await api('/api/admin/locations');APP.adminLocations=d.locations||[];if(APP.view==='admin'&&getAdminSection()==='radar')render()}catch(e){console.warn('admin location feed',e)}}
function adminRadar(){const now=Date.now();const entries=(APP.adminLocations||[]).filter(x=>Number.isFinite(Number(x.lat))&&Number.isFinite(Number(x.lon))).map(x=>{const age=now-Date.parse(x.updatedAt||0);const status=age<30000?'Aktif':age<120000?'Hilang Sinyal':'Offline';return {...x,status,age}});return `<div class=\"page-head\"><div><div class=\"eyebrow\">TACTICAL RADAR / POSISI PERSONEL</div><h1 class=\"title\" style=\"font-size:34px\">Posisi Personel</h1><div class=\"subtitle\">Menampilkan posisi hanya dari personel yang mengaktifkan transmisi lokasi dan memberikan izin perangkat.</div></div><div class=\"actions\"><button class=\"btn small\" onclick=\"loadAdminLocations()\">${icon('refresh')} REFRESH</button><span class=\"chip ${entries.length?'success':'neutral'}\">${entries.length} TRANSMISI</span></div></div><div class=\"notice\" style=\"margin-bottom:14px\"><b>PEMANTAUAN TEROTORISASI.</b> Lokasi berasal dari GPS perangkat nyata. Data berhenti diperbarui ketika personel mematikan transmisi, sesi berakhir, atau izin dicabut.</div><div class=\"radar-layout\"><div class=\"card\"><div class=\"radar\"><div class=\"radar-line\"></div><div class=\"radar-v\"></div><div class=\"radar-h\"></div><div class=\"radar-core\"></div>${entries.map((p,i)=>`<span class=\"radar-dot ${p.status==='Offline'?'off':p.status==='Hilang Sinyal'?'warn':''}\" style=\"left:${15+(i*19)%70}%;top:${18+(i*23)%64}%\" title=\"${esc(p.name||p.userId)}\"></span>`).join('')}</div><div class=\"status-list\" style=\"margin-top:12px\"><div class=\"status-row\"><span>Feed</span><b>${entries.length?'ACTIVE':'WAITING'}</b></div><div class=\"status-row\"><span>Source</span><b>DEVICE GPS</b></div><div class=\"status-row\"><span>Refresh</span><b>10 SEC</b></div></div></div><div class=\"card\"><div class=\"eyebrow\">PERSONNEL LIVE LOCATION</div>${entries.length?`<div class=\"personnel-list\" style=\"margin-top:10px\">${entries.map(p=>`<div class=\"person-card\"><div class=\"p-avatar\"><img src=\"${p.photo||fakePhoto(p.name||'P',3)}\" alt=\"\"></div><div><div class=\"name\">${esc(p.name||p.userId)}</div><div class=\"meta\">${statusChip(p.status)} · ${esc(p.role||'Analis')}</div><div class=\"coords\">${Number(p.lat).toFixed(6)}, ${Number(p.lon).toFixed(6)} · ±${Math.round(Number(p.accuracy||0))} m</div><div class=\"meta\">Baterai ${p.battery==null?'—':esc(String(p.battery))+'%'} · Jaringan ${esc(p.network||'Tidak diketahui')}</div><div style=\"margin-top:6px\"><a class=\"mini-link\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps?q=${encodeURIComponent(Number(p.lat)+','+Number(p.lon))}\">BUKA PETA</a></div></div><div style=\"font-size:10px;text-align:right\"><b>${p.age<1000?'<1 dtk':Math.round(p.age/1000)+' dtk'}</b><div class=\"meta\">${new Date(p.updatedAt).toLocaleTimeString('id-ID')}</div></div></div>`).join('')}</div>`:`<div class=\"empty\" style=\"margin-top:14px\">Belum ada personel yang mengaktifkan transmisi lokasi aktual.</div>`}</div></div>`}

function dataTable(data,type,showPhoto=false){const q=APP.search.q.toLowerCase();let arr=data.filter(r=>JSON.stringify(r).toLowerCase().includes(q));arr=arr.filter(r=>APP.search.classification==='all'||r.classification===APP.search.classification||r.clearance===APP.search.classification);arr=arr.filter(r=>APP.search.status==='all'||r.status===APP.search.status);const pg=APP.search.page,per=10,pages=Math.max(1,Math.ceil(arr.length/per));if(pg>pages)APP.search.page=pages;const slice=arr.slice((APP.search.page-1)*per,APP.search.page*per);return `<div class="card"><div class="toolbar"><div class="grow"><input class="input" placeholder="Cari data..." value="${esc(APP.search.q)}" oninput="APP.search.q=this.value;APP.search.page=1;render()"></div><select class="select" style="width:auto" onchange="APP.search.classification=this.value;APP.search.page=1;render()"><option value="all">Semua Klasifikasi</option>${LEVELS.map(x=>`<option ${APP.search.classification===x?'selected':''}>${x}</option>`).join('')}</select><select class="select" style="width:auto" onchange="APP.search.status=this.value;APP.search.page=1;render()"><option value="all">Semua Status</option>${Array.from(new Set(data.map(x=>x.status))).slice(0,10).map(x=>`<option ${APP.search.status===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="table-wrap"><table class="table"><thead><tr>${type==='personnel'?'<th>Personel</th><th>Divisi</th><th>Wilayah</th><th>Clearance</th><th>Status</th>':type==='documents'?'<th>Dokumen</th><th>Penulis</th><th>Divisi</th><th>Klasifikasi</th><th>Status</th>':'<th>Record</th><th>Kategori</th><th>Wilayah</th><th>Klasifikasi</th><th>Status</th>'}</tr></thead><tbody>${slice.map(r=>`<tr onclick="openDataDetail('${type}','${r.id||('event-'+r.date+'-'+r.location)}','${r.id?escAttr(r.id):('event-'+r.date+'-'+escAttr(r.location))}')" style="cursor:pointer">${type==='personnel'?`<td><div style="display:flex;gap:9px;align-items:center"><div class="avatar">${showPhoto?`<img src="${r.photo}" alt="">`:`<span class="initials">${initials(r.name)}</span>`}</div><div><div class="primary-cell">${r.name}</div><div class="muted">${r.id}</div></div></div></td><td>${r.division}</td><td>${r.region}</td><td>${levelChip(r.clearance)}</td><td>${statusChip(r.status)}</td>`:type==='documents'?`<td><div class="primary-cell">${r.title}</div><div class="muted">${r.id}</div></td><td>${r.author}</td><td>${r.division}</td><td>${levelChip(r.classification)}</td><td>${statusChip(r.status)}</td>`:`<td><div class="primary-cell">${r.name||r.subject||r.id||r.date}</div><div class="muted">${r.id||r.date||''}</div></td><td>${r.category||r.type||r.class||'-'}</td><td>${r.region||r.location||'-'}</td><td>${levelChip(r.classification||r.clearance||'PUBLIC')}</td><td>${statusChip(r.status||'Active')}</td>`}</tr>`).join('')}</tbody></table></div><div>${slice.map(r=>`<div class="result-card card soft clickable" style="margin-top:8px" onclick="openDataDetail('${type}','${r.id||('event-'+r.date+'-'+r.location)}','${r.id?escAttr(r.id):('event-'+r.date+'-'+escAttr(r.location))}')">${mobileRecordRows(r,type)}</div>`).join('')}</div><div class="pagination"><span>${arr.length} record · halaman ${APP.search.page}/${pages}</span><div class="pager"><button onclick="APP.search.page=Math.max(1,APP.search.page-1);render()">‹</button>${Array.from({length:Math.min(5,pages)},(_,i)=>{let n=Math.min(Math.max(1,APP.search.page-2)+i,pages);return `<button class="${n===APP.search.page?'active':''}" onclick="APP.search.page=${n};render()">${n}</button>`}).join('')}<button onclick="APP.search.page=Math.min(${pages},APP.search.page+1);render()">›</button></div></div></div>`}
function mobileRecordRows(r,type){if(type==='personnel')return `<div class="detail-head"><div class="avatar">${r.photo?`<img src="${r.photo}">`:initials(r.name)}</div><div><div class="primary-cell">${r.name}</div><div class="muted">${r.id}</div></div></div><div class="rule" style="margin:10px 0"></div><div class="row"><span class="k">Divisi</span><span class="v">${r.division}</span></div><div class="row"><span class="k">Wilayah</span><span class="v">${r.region}</span></div><div class="row"><span class="k">Clearance</span><span class="v">${levelChip(r.clearance)}</span></div><div class="row"><span class="k">Status</span><span class="v">${statusChip(r.status)}</span></div>`;return `<div class="primary-cell">${r.title||r.name||r.subject||r.id||r.date}</div><div class="rule" style="margin:10px 0"></div><div class="row"><span class="k">Klasifikasi</span><span class="v">${levelChip(r.classification||r.clearance||'PUBLIC')}</span></div><div class="row"><span class="k">Status</span><span class="v">${statusChip(r.status||'Active')}</span></div><div class="row"><span class="k">Wilayah</span><span class="v">${r.region||r.location||'-'}</span></div>`}
function openDataDetail(type,id){let r;switch(type){case'personnel':r=personnel.find(x=>x.id===id);break;case'documents':r=documents.find(x=>x.id===id);break;case'profiles':r=profiles.find(x=>x.id===id);break;case'studies':r=studies.find(x=>x.id===id);break;case'equipment':r=equipment.find(x=>x.id===id);break;case'vehicles':r=vehicles.find(x=>x.id===id);break;case'facilities':r=facilities.find(x=>x.id===id);break;case'organizations':r=organizations.find(x=>x.id===id);break;case'events':r=events.find((x)=>`event-${x.date}-${x.location}`===id);break;default:r=null}if(!r)return;if((r.clearance||r.classification)&&!canAccess(r.clearance||r.classification)){APP.currentRecord={r,type};setView('denied');return}if(type==='documents')return openDocument(r);const photo=r.photo?`<div class="detail-photo"><img src="${r.photo}" alt=""></div>`:'';const entries=Object.entries(r).filter(([k])=>k!=='photo').slice(0,18);openModal('DETAIL RECORD',`${photo}<div class="detail-meta" style="margin-top:15px">${entries.map(([k,v])=>`<div class="meta-box"><div class="k">${k}</div><div class="v">${esc(String(v))}</div></div>`).join('')}</div>${type==='personnel'&&APP.adminAuthed?`<div class="rule"></div><div class="eyebrow">ADMIN ACTIONS</div><div class="review-actions"><button class="btn danger" onclick="terminatePersonnel('${r.id}')">PEMECATAN / CABUT AKSES</button><button class="btn danger" onclick="deletePersonnelData('${r.id}')">HAPUS DATA</button></div>`:''}`,{eyebrow:type.toUpperCase()})}
function canAccess(level){const rank=LEVELS.indexOf(level);return rank<=2}
function openDocument(r){if(!canAccess(r.classification)){APP.currentRecord=r;setView('denied');return}addAudit(currentUser().id,'VIEW',r.id);setView('app');setTimeout(()=>openModal('CLASSIFIED RECORD',documentViewer(r),{eyebrow:'DOCUMENT VIEWER'}),50)}
function documentViewer(r){return `<div class="viewer"><div class="watermark">IKSN — CONFIDENTIAL</div><div class="doc-meta-grid">${[['Document ID',r.id],['Classification',r.classification],['Authorization',`LEVEL ${LEVELS.indexOf(r.classification)+1}`],['Version',r.version],['Date',r.date],['Author',r.author]].map(([k,v])=>`<div class="doc-meta-card"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('')}</div><article class="doc-content"><h2>${r.title}</h2><p class="muted">Dokumen fiktif untuk demonstrasi viewer, klasifikasi, metadata, related records, dan access history.</p><h3>Abstract</h3><p>Dokumen ini mengkaji ketahanan kelembagaan, pengambilan keputusan, kesiapsiagaan, dan pelajaran dari skenario sintetis. Tidak berisi instruksi operasional nyata.</p><h3>Summary</h3><p>Temuan disusun untuk membantu peneliti menguji struktur informasi. Fokus utama meliputi governance, koordinasi, dokumentasi, dan continuity.</p><h3>Analysis</h3><p>Analisis menggunakan data simulasi dengan beberapa tingkat confidence. Setiap kesimpulan bersifat ilustratif dan tidak dimaksudkan sebagai kebijakan operasional.</p><h3>Key Findings</h3><p>Ketahanan meningkat ketika otoritas, prosedur, komunikasi, dan dokumentasi dipahami bersama sebagai sistem institusional yang saling terhubung.</p><h3>Lessons Learned</h3><p>Catatan penting: keputusan yang baik membutuhkan konteks, validasi sumber, jalur eskalasi yang jelas, dan audit pascakegiatan.</p><h3>Metadata</h3><p>ID: ${r.id}<br>Divisi: ${r.division}<br>Status: ${r.status}<br>Pembaruan: ${r.updated}</p><h3>Related Records</h3><p>${documents.slice(0,4).map(x=>x.id).join(' · ')}</p><h3>Access History</h3><p>Riwayat akses simulasi tercatat pada audit trail.</p></article></div>`}
function appShell(){return `<div class="view"><div class="shell"><aside class="sidebar" id="appSidebar"><div class="brand">${logo()}<div><div class="brand-name">IKSN</div><div class="brand-sub">Secure Information Archive</div></div></div><nav class="side-nav">${navGroup('RINGKASAN',[['dashboard','Dashboard','grid']])}${navGroup('INTELLIGENCE & RESEARCH',[['profiles','Profil Strategis','people'],['regional','Analisis Kawasan','map'],['studies','Riset Keamanan','file'],['geo','Data Geopolitik','map'],['resilience','Studi Ketahanan','shield']])}${navGroup('STRATEGIC ARCHIVE',[['defense','Studi Pertahanan','shield'],['analysis','Analisis Strategis','chart'],['crisis','Simulasi Krisis','shield'],['history','Kajian Historis','file']])}${navGroup('DATABASE',[['personnel','Personel','people'],['equipment','Peralatan','settings'],['vehicles','Kendaraan','map'],['facilities','Fasilitas','grid'],['organizations','Organisasi','people'],['events','Peristiwa','file']])}${navGroup('DOKUMEN',[['documents','Laporan','doc'],['briefing','Briefing','doc'],['researchpapers','Research Papers','file'],['classified','Classified Archive','lock']])}${navGroup('MAPS',[['mapglobal','Ikhtisar Global','map'],['mapregional','Kawasan Strategis','map'],['mapresearch','Lokasi Riset','pin'],['mapevents','Peristiwa Historis','pin']])}${navGroup('ANALYTICS',[['analytics','Analitik','chart']])}${navGroup('SECURITY',[['audit','Riwayat Akses','file'],['security','Security Center','shield'],['profile','Keamanan Akun','settings']])}</nav><div class="sidebar-footer">Sistem Informasi Terbatas<br>PROTOTYPE ENVIRONMENT — ALL RECORDS ARE FICTIONAL</div></aside><main class="main"><header class="topbar"><div class="top-actions"><button class="mobile-menu" onclick="document.getElementById('appSidebar').classList.toggle('open')">${icon('menu')}</button><div><div class="brand-name">SECURE INFORMATION ARCHIVE</div><div class="brand-sub">Pusat Data Strategis dan Ketahanan Institusional</div></div></div><div class="top-actions"><span class="chip ${APP.locationTx?'success':'neutral'}">${APP.locationTx?'LOC TX ON':'DEVICE VERIFIED'}</span><span class="top-hide" id="sessionClock">--:--</span><button class="btn small top-hide" onclick="openNotifications()">${icon('bell')}</button><button class="btn small" onclick="logout()">${icon('logout')} <span class="top-hide">Keluar</span></button><div class="profile-mini"><div class="avatar"><img src="${currentUser().photo}"></div><div class="small-meta"><div style="font-size:11px;font-weight:700">${currentUser().name}</div><div style="font-size:9px;color:#777">${currentUser().id} · ${currentUser().clearance}</div></div></div></div></header><div class="page">${appContent()}</div></main></div></div>`}
function navGroup(label,items){return `<div class="side-group"><div class="side-label">${label}</div>${items.map(([id,t,i])=>`<button class="nav-btn ${APP.currentSection===id?'active':''}" onclick="nav('${id}')">${icon(i)}<span>${t}</span></button>`).join('')}</div>`}
function appContent(){const s=APP.currentSection;switch(s){case'dashboard':return dashboard();case'personnel':return dataSection('Personel Database','personnel',personnel);case'profiles':return dataSection('Profil Strategis','profiles',profiles);case'studies':return dataSection('Strategic Studies','studies',studies);case'equipment':return dataSection('Equipment Database','equipment',equipment);case'vehicles':return dataSection('Vehicle Archive','vehicles',vehicles);case'facilities':return dataSection('Facility Database','facilities',facilities);case'organizations':return dataSection('Organization Database','organizations',organizations);case'events':return dataSection('Historical Events','events',events);case'documents':return dataSection('Document Archive','documents',documents);case'briefing':return dataSection('Briefing Archive','documents',documents.slice(0,25));case'researchpapers':return dataSection('Research Papers','documents',documents.filter((_,i)=>i%2===0));case'classified':return dataSection('Classified Archive','documents',documents.filter(x=>LEVELS.indexOf(x.classification)>=2));case'analytics':return analytics();case'security':return securityCenter();case'audit':return auditView(false);case'profile':return userProfile();default:return genericSection(s)}}
function dashboard(){const u=currentUser();return `<div class="page-head"><div><div class="eyebrow">RINGKASAN SISTEM</div><h1 class="title" style="font-size:34px">Selamat datang kembali, ${u.name.split(' ')[0]}.</h1><div class="subtitle">Pusat arsip strategis untuk penelitian, ketahanan, dan kesiapsiagaan institusional.</div></div><div class="actions"><button class="btn" onclick="nav('documents')">${icon('doc')} Buka Arsip</button><button class="btn" onclick="nav('security')">${icon('shield')} Security Center</button></div></div><div class="quick-grid">${[['Dokumen Diakses',128,'bulan ini'],['Kajian Aktif',34,'tersedia'],['Personel Terverifikasi',44,'dari 60'],['Alert Keamanan',4,'perlu perhatian']].map(x=>`<div class="card stat"><div class="k">${x[0]}</div><div class="v">${x[1]}</div><div class="s">${x[2]}</div></div>`).join('')}</div><div class="panel-grid" style="margin-top:16px"><div class="stack"><div class="card"><div class="page-head"><div><div class="eyebrow">AKTIVITAS TERBARU</div><h3 class="section-title">Jejak Akses</h3></div><button class="btn small" onclick="nav('audit')">Lihat audit</button></div>${audit.slice(0,6).map(e=>`<div style="display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:11px"><div><b>${e.action}</b><div class="muted">${e.user} · ${e.record}</div></div><div style="text-align:right"><div>${statusChip(e.result)}</div><div class="muted" style="margin-top:4px">${e.timestamp}</div></div></div>`).join('')}</div><div class="card"><div class="eyebrow">KAJIAN STRATEGIS TERBARU</div><h3 class="section-title" style="margin-top:7px">Research Desk</h3><div class="grid grid-auto" style="margin-top:14px">${studies.slice(0,4).map(s=>`<div class="card soft clickable" onclick="openDataDetail('studies','${s.id}')"><div class="eyebrow">${s.id}</div><div style="font-weight:700;font-size:12px;margin-top:6px">${s.title}</div><div class="muted" style="font-size:10px;margin-top:6px">${levelChip(s.classification)}</div></div>`).join('')}</div></div></div><div class="stack"><div class="card"><div class="eyebrow">PERINGATAN KEAMANAN</div>${securityEvents.slice(0,4).map(e=>`<div style="padding:10px 0;border-bottom:1px solid var(--line);font-size:11px"><div style="display:flex;justify-content:space-between;gap:6px"><b>${e.action}</b>${statusChip(e.severity)}</div><div class="muted" style="margin-top:4px">${e.user} · ${e.record}</div></div>`).join('')}</div><div class="card"><div class="eyebrow">KAWASAN KAJIAN</div><div class="bar-chart" style="margin-top:14px">${regions.slice(0,6).map((r,i)=>`<div class="bar-row"><div>${r}</div><div class="bar-track"><div class="bar-fill" style="width:${30+i*11}%"></div></div><div>${30+i*11}%</div></div>`).join('')}</div></div><div class="card"><div class="eyebrow">LOKASI PERSONEL</div><div class="notice ${APP.locationTx?'success':''}">${APP.locationTx?'Transmisi lokasi aktual perangkat Anda aktif. Ikon radar berkedip sebagai indikator.':'Transmisi lokasi belum diaktifkan. Anda dapat mengaktifkannya dari Security Center.'}</div><div style="display:flex;justify-content:center;margin-top:18px"><div class="radar-core radar-blink" style="position:relative;left:auto;top:auto;transform:none;width:14px;height:14px"></div></div></div></div></div>${appFooter()}`}
function dataSection(title,type,data){return `<div class="page-head"><div><div class="eyebrow">DATABASE</div><h1 class="title" style="font-size:34px">${title}</h1><div class="subtitle">Gunakan pencarian, filter, dan detail record untuk menjelajah dataset fiktif.</div></div></div>${dataTable(data,type,type==='personnel')}${appFooter()}`}
function genericSection(s){const labels={regional:'Analisis Kawasan',geo:'Data Geopolitik',resilience:'Studi Ketahanan',defense:'Studi Pertahanan',analysis:'Analisis Strategis',crisis:'Simulasi Krisis',history:'Kajian Historis',mapglobal:'Ikhtisar Global',mapregional:'Kawasan Strategis',mapresearch:'Lokasi Riset',mapevents:'Peristiwa Historis'};const t=labels[s]||'Modul';return `<div class="page-head"><div><div class="eyebrow">STRATEGIC RESEARCH</div><h1 class="title" style="font-size:34px">${t}</h1><div class="subtitle">Ruang kerja tematik dengan data simulasi untuk kebutuhan demonstrasi.</div></div></div><div class="grid grid-auto">${Array.from({length:8},(_,i)=>`<div class="card clickable" onclick="openDataDetail('profiles','${profiles[(i+s.length)%profiles.length].id}')"><div class="eyebrow">${profiles[(i+s.length)%profiles.length].id}</div><h3 style="font-size:14px;margin:7px 0">${profiles[(i+s.length)%profiles.length].subject}</h3><div class="muted" style="font-size:11px">${profiles[(i+s.length)%profiles.length].region}</div><div style="margin-top:10px">${levelChip(profiles[(i+s.length)%profiles.length].classification)}</div></div>`).join('')}</div>${appFooter()}`}
function analytics(){const count=x=>x.reduce((m,r)=>(m[r.classification||r.clearance]=(m[r.classification||r.clearance]||0)+1,m),{});const c1=count(personnel),c2=count(documents),c3=count(equipment);return `<div class="page-head"><div><div class="eyebrow">ANALYTICS</div><h1 class="title" style="font-size:34px">Analitik Institusional</h1><div class="subtitle">Visualisasi ringan berdasarkan dataset fiktif yang tertanam di browser.</div></div></div><div class="grid grid-3"><div class="card"><div class="eyebrow">CLEARANCE PERSONEL</div><div class="bar-chart" style="margin-top:14px">${LEVELS.map(x=>`<div class="bar-row"><div>${x}</div><div class="bar-track"><div class="bar-fill" style="width:${Math.min(100,(c1[x]||0)/60*100)}%"></div></div><div>${c1[x]||0}</div></div>`).join('')}</div></div><div class="card"><div class="eyebrow">KLASIFIKASI DOKUMEN</div><div class="bar-chart" style="margin-top:14px">${LEVELS.map(x=>`<div class="bar-row"><div>${x}</div><div class="bar-track"><div class="bar-fill" style="width:${Math.min(100,(c2[x]||0)/documents.length*100)}%"></div></div><div>${c2[x]||0}</div></div>`).join('')}</div></div><div class="card"><div class="eyebrow">STATUS PERALATAN</div><div class="bar-chart" style="margin-top:14px">${['Active','Maintenance','Reserve','Retired'].map(x=>{const n=equipment.filter(e=>e.status===x).length;return `<div class="bar-row"><div>${x}</div><div class="bar-track"><div class="bar-fill" style="width:${n/equipment.length*100}%"></div></div><div>${n}</div></div>`}).join('')}</div></div></div><div class="grid grid-2" style="margin-top:16px"><div class="card"><div class="eyebrow">PERSONEL PER DIVISI</div><div class="bar-chart" style="margin-top:14px">${divisions.map(d=>{const n=personnel.filter(p=>p.division===d).length;return `<div class="bar-row"><div>${d}</div><div class="bar-track"><div class="bar-fill" style="width:${Math.max(5,n/personnel.length*1000)}%"></div></div><div>${n}</div></div>`}).join('')}</div></div><div class="card"><div class="eyebrow">KEJADIAN KEAMANAN</div><div class="bar-chart" style="margin-top:14px">${['INFO','NOTICE','WARNING','CRITICAL'].map(x=>{const n=securityEvents.filter(e=>e.severity===x).length;return `<div class="bar-row"><div>${x}</div><div class="bar-track"><div class="bar-fill" style="width:${n/securityEvents.length*100}%"></div></div><div>${n}</div></div>`}).join('')}</div></div></div>${appFooter()}`}
function securityCenter(){return `<div class="page-head"><div><div class="eyebrow">SECURITY</div><h1 class="title" style="font-size:34px">Security Center</h1><div class="subtitle">Ringkasan perangkat, sesi, notifikasi, dan transmisi lokasi akun.</div></div></div><div class="grid grid-2"><div class="card"><div class="eyebrow">SESSION</div><div class="grid grid-2" style="margin-top:10px"><div class="stat"><div class="k">Status</div><div class="v" style="font-size:18px">${APP.session.active?'SECURE':'EXPIRED'}</div></div><div class="stat"><div class="k">Transmisi Lokasi</div><div class="v" style="font-size:18px">${APP.locationTx?'AKTIF':'NONAKTIF'}</div></div></div><div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="btn" onclick="resetSession();toast('Sesi diperpanjang.','success');render()">TETAP MASUK</button>${!APP.locationTx?`<button class="btn primary" onclick="locationPrompt()">AKTIFKAN TRANSMISI LOKASI</button>`:`<button class="btn danger" onclick="stopLocationTracking();toast('Transmisi lokasi dihentikan.','success');render()">HENTIKAN TRANSMISI</button>`}</div></div><div class="card"><div class="eyebrow">TRUSTED DEVICES</div><div class="status-list" style="margin-top:8px"><div class="status-row"><span>Perangkat Utama</span><b>${statusChip('TRUSTED DEVICE')}</b></div><div class="status-row"><span>Last Verification</span><b>2026-09-02</b></div><div class="status-row"><span>Active Sessions</span><b>1</b></div><div class="status-row"><span>Koordinat terakhir</span><b>${APP.location.lat!=null?Number(APP.location.lat).toFixed(6)+', '+Number(APP.location.lon).toFixed(6):'Belum tersedia'}</b></div></div></div></div><div class="card" style="margin-top:16px"><div class="eyebrow">EVENT FEED</div><div style="margin-top:10px">${securityEvents.slice(0,10).map(e=>`<div style="display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--line);font-size:11px"><div><b>${e.action}</b><div class="muted">${e.user} · ${e.record}</div></div><div style="text-align:right">${statusChip(e.severity)}<div class="muted" style="margin-top:4px">${e.timestamp}</div></div></div>`).join('')}</div></div>${appFooter()}`}
function auditView(admin=false){return `<div class="page-head"><div><div class="eyebrow">AUDIT TRAIL</div><h1 class="title" style="font-size:34px">Riwayat Akses</h1><div class="subtitle">Setiap aktivitas penting pada prototype dicatat dalam log simulasi.</div></div></div><div class="card">${dataAuditTable(audit.slice(0,80))}</div>${appFooter()}`}
function dataAuditTable(arr){return `<div class="table-wrap"><table class="table"><thead><tr><th>Timestamp</th><th>User</th><th>Action</th><th>Record</th><th>Device</th><th>Result</th></tr></thead><tbody>${arr.map(e=>`<tr><td>${e.timestamp}</td><td>${e.user}</td><td>${e.action}</td><td>${e.record}</td><td>${e.device}</td><td>${statusChip(e.result)}</td></tr>`).join('')}</tbody></table></div><div>${arr.slice(0,16).map(e=>`<div class="result-card card soft" style="margin-top:8px"><div class="row"><span class="k">Timestamp</span><span class="v">${e.timestamp}</span></div><div class="row"><span class="k">User</span><span class="v">${e.user}</span></div><div class="row"><span class="k">Action</span><span class="v">${e.action}</span></div><div class="row"><span class="k">Record</span><span class="v">${e.record}</span></div><div class="row"><span class="k">Result</span><span class="v">${statusChip(e.result)}</span></div></div>`).join('')}</div>`}
function userProfile(){const u=currentUser();return `<div class="page-head"><div><div class="eyebrow">AUTHORIZED PERSONNEL</div><h1 class="title" style="font-size:34px">${u.name}</h1><div class="subtitle">Profil personel, akses, trusted devices, sesi, dan aktivitas keamanan.</div></div></div><div class="grid grid-2"><div class="card"><div class="detail-head"><div class="detail-photo"><img src="${u.photo}" alt=""></div><div><div class="eyebrow">VERIFIED</div><h3 style="margin:7px 0">${u.name}</h3><div class="muted" style="font-size:12px">${u.position}</div></div></div><div class="detail-meta" style="margin-top:15px">${[['Personnel ID',u.id],['Department',u.division],['Clearance',u.clearance],['Scope',u.scope],['Role',u.role],['Status',u.status]].map(([k,v])=>`<div class="meta-box"><div class="k">${k}</div><div class="v">${k==='Clearance'?levelChip(v):k==='Status'?statusChip(v):v}</div></div>`).join('')}</div></div><div class="card"><div class="eyebrow">SECURITY PROFILE</div><div class="status-list" style="margin-top:8px"><div class="status-row"><span>Trusted Devices</span><b>1</b></div><div class="status-row"><span>Recent Sessions</span><b>1 Active</b></div><div class="status-row"><span>Last Verification</span><b>2026-09-02 20:38</b></div><div class="status-row"><span>Location Transmission</span><b>${APP.locationTx?'ACTIVE':'OFF'}</b></div></div><div style="margin-top:15px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="nav('security')">MANAGE SECURITY</button><button class="btn" onclick="nav('audit')">VIEW ACCESS HISTORY</button></div></div></div>${appFooter()}`}
function adminSecurity(){return `<div class="page-head"><div><div class="eyebrow">SECURITY</div><h1 class="title" style="font-size:34px">Security Alerts</h1><div class="subtitle">Peristiwa keamanan simulasi dengan severity INFO, NOTICE, WARNING, dan CRITICAL.</div></div></div><div class="grid grid-auto">${securityEvents.slice(0,16).map(e=>`<div class="card"><div style="display:flex;justify-content:space-between;gap:8px">${statusChip(e.severity)}<span class="muted">${e.timestamp}</span></div><h3 style="font-size:14px;margin:9px 0">${e.action}</h3><div class="muted" style="font-size:11px">${e.user} · ${e.record} · ${e.device}</div></div>`).join('')}</div>`}
function adminPolicies(){return `<div class="page-head"><div><div class="eyebrow">TATA KELOLA DATA</div><h1 class="title" style="font-size:34px">Kebijakan & Retensi</h1><div class="subtitle">Informasi developer/admin mengenai batasan prototype dan arsitektur produksi yang disarankan.</div></div></div><div class="grid grid-2"><div class="card"><div class="eyebrow">PROTOTYPE LIMITATION</div><p class="muted" style="line-height:1.7">Autentikasi dan biometrik pada prototype ini merupakan simulasi antarmuka. Sistem produksi tidak boleh menyimpan password, token autentikasi, atau data biometrik sensitif hanya di sisi klien.</p></div><div class="card"><div class="eyebrow">PRODUCTION ARCHITECTURE</div><ul class="muted" style="line-height:1.9;padding-left:18px"><li>secure backend + HTTPS</li><li>secure cookies + MFA</li><li>WebAuthn / passkeys</li><li>server-side authorization + RBAC</li><li>encrypted storage + key management</li><li>audit logging + rate limiting</li><li>session revocation + device management</li><li>retention, consent, deletion, backup</li></ul></div></div>`}
function adminClassifications(){return `<div class="page-head"><div><div class="eyebrow">KLASIFIKASI</div><h1 class="title" style="font-size:34px">Security Clearance</h1><div class="subtitle">Hierarki fiktif untuk mengatur akses record di prototype.</div></div></div><div class="grid grid-3">${LEVELS.map((x,i)=>`<div class="card"><div>${levelChip(x)}</div><h3 style="font-size:18px;margin:12px 0">Level ${i+1}</h3><div class="muted" style="font-size:11px;line-height:1.6">Record dengan klasifikasi ini hanya dapat dibuka oleh akun dengan clearance setara atau lebih tinggi.</div></div>`).join('')}</div>`}
function deniedView(){const req=(APP.currentRecord?.r?.clearance||APP.currentRecord?.r?.classification||'SECRET');return `<div class="welcome view"><div class="welcome-panel" style="width:min(700px,calc(100% - 30px))"><div style="width:70px;height:70px;border:1px solid #3e3234;border-radius:18px;display:grid;place-items:center;margin:0 auto 18px;color:#d49398">${icon('lock')}</div><div class="eyebrow">ACCESS CONTROL</div><h1 class="title" style="font-size:42px">ACCESS DENIED</h1><div class="subtitle" style="margin:0 auto">Informasi ini berada di luar tingkat otorisasi akun Anda.</div><div class="grid grid-2" style="text-align:left;margin:22px 0"><div class="card"><div class="eyebrow">CURRENT CLEARANCE</div><div style="margin-top:8px;font-weight:800">${currentUser().clearance}</div></div><div class="card"><div class="eyebrow">REQUIRED CLEARANCE</div><div style="margin-top:8px;font-weight:800">${req}</div></div></div><button class="btn primary" onclick="APP.view='app';APP.currentSection='documents';render()">KEMBALI KE ARSIP</button></div></div>`}
function expiredView(){return `<div class="welcome view"><div class="welcome-panel"><div style="width:70px;height:70px;border:1px solid #3e3234;border-radius:18px;display:grid;place-items:center;margin:0 auto 18px">${icon('lock')}</div><div class="eyebrow">SECURE SESSION</div><h1 class="title" style="font-size:42px">SECURE SESSION EXPIRED</h1><div class="subtitle" style="margin:0 auto">Untuk melindungi akun Anda, sesi telah dihentikan secara otomatis.</div><button class="btn primary" style="margin-top:20px" onclick="startAuth()">RE-AUTHENTICATE</button></div></div>`}
async function logout(){stopCameraStream();stopRegistrationCapture();stopLocationTracking();try{await api('/api/auth/logout',{method:'POST',body:'{}'})}catch(_){}clearInterval(APP.sessionRefreshTimer);APP.sessionRefreshTimer=null;APP.location={watchId:null,lat:null,lon:null,accuracy:null,updatedAt:null,battery:null,network:null};APP.authEmail='';APP.session.active=false;APP.view='logout';render()}
function logoutView(){return `<div class="welcome view"><div class="welcome-panel"><div style="width:70px;height:70px;border:1px solid #3e3234;border-radius:18px;display:grid;place-items:center;margin:0 auto 18px">${icon('check')}</div><div class="eyebrow">SESSION TERMINATED</div><h1 class="title" style="font-size:42px">Sesi Aman Ditutup</h1><div class="subtitle" style="margin:0 auto">Sesi aman Anda telah ditutup.</div><div class="card" style="max-width:420px;margin:22px auto;text-align:left"><div class="status-row"><span>Session ID</span><b>SES-IKSN-${rand(1000,9999)}</b></div><div class="status-row"><span>Timestamp</span><b>${new Date().toLocaleString('id-ID')}</b></div><div class="status-row"><span>Device</span><b>VERIFIED DEVICE</b></div></div><button class="btn primary" onclick="startAuth()">RETURN TO SECURE ACCESS</button></div></div>`}
function appFooter(){return `<div class="footer"><div class="footer-row"><div><b style="color:#b7b2aa">INSTITUT KETAHANAN STRATEGIS NUSANTARA</b><div style="margin-top:4px">Institute for Strategic Defense &amp; Resilience · Sistem Informasi Terbatas</div></div><div style="text-align:right"><div>SYSTEM STATUS — OPERATIONAL</div><div style="font-size:8px;letter-spacing:.14em;color:#4e4a45;margin-top:3px">NODE HAYDAR-S/07</div><div class="footer-links" style="margin-top:6px"><button onclick="openInfo('Kebijakan Keamanan',policyInfo())">Kebijakan Keamanan</button><button onclick="openInfo('Kebijakan Privasi',privacyInfo())">Kebijakan Privasi</button><button onclick="openInfo('Ketentuan Penggunaan','<p class=\'muted\'>Seluruh record adalah fiktif dan dibuat untuk demonstrasi.</p>')">Ketentuan Penggunaan</button><button onclick="openInfo('Bantuan','<p class=\'muted\'>Gunakan menu Security Center atau hubungi administrator institusional pada implementasi nyata.</p>')">Bantuan</button></div></div></div></div>`}
function policyInfo(){return `<div class="stack"><div class="notice">Prototype tidak memberikan keamanan militer nyata.</div><p class="muted" style="line-height:1.7">Untuk produksi gunakan backend terautentikasi, secure cookies, MFA, WebAuthn/passkeys, RBAC, audit logging, rate limiting, session revocation, encryption, key management, retention policy, consent, dan deletion policy.</p></div>`}
function privacyInfo(){return `<p class="muted" style="line-height:1.7">Foto yang diunggah pada prototype disimpan sementara di browser. Implementasi produksi harus menggunakan storage backend aman dengan encryption at rest/in transit, pembatasan akses, audit, kebijakan retensi, dan penghapusan yang jelas.</p>`}
function openInfo(title,body){openModal(title,body,{eyebrow:'INFORMASI'})}
function openNotifications(){openInfo('Notifikasi Keamanan',`<div class="stack">${securityEvents.slice(0,6).map(e=>`<div class="notice"><div style="display:flex;justify-content:space-between;gap:8px"><b>${e.action}</b>${statusChip(e.severity)}</div><div class="muted" style="margin-top:4px">${e.timestamp} · ${e.record}</div></div>`).join('')}</div>`)}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function escAttr(s){return String(s).replace(/'/g,"\\'")}
function toast(msg,type='info'){const el=document.createElement('div');el.style=`position:fixed;right:14px;bottom:14px;z-index:40;max-width:min(420px,calc(100% - 28px));padding:12px 14px;border:1px solid ${type==='danger'?'#5a2d31':type==='success'?'#31533a':'#3b3935'};background:${type==='danger'?'#211214':type==='success'?'#132117':'#171717'};color:#e8e2d8;border-radius:12px;box-shadow:0 15px 40px rgba(0,0,0,.35);font-size:12px;line-height:1.45`;el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),3600)}
function bindCommon(){/* no-op placeholder for future component binding */}
setInterval(()=>{if((APP.view==='app'||APP.view==='admin')&&APP.session.active){const left=APP.session.expiresAt-Date.now();const el=document.getElementById('sessionClock');if(left<=0){APP.session.active=false;if(APP.view==='admin'){APP.adminAuthed=false;APP.adminAuth={step:1,email:'',lockedUntil:0,failures:0,otpFailures:0,otpLockedUntil:0,device:false,biometric:false};APP.view='welcome';addAudit('ADMIN-GATE','PRIVILEGED SESSION EXPIRED','ADMIN-001','EXPIRED','ADMIN CONSOLE')}else{APP.view='expired'}render();return}if(APP.view==='app'&&left<120000&&left>0&&!APP.statusPulse){APP.statusPulse=true;openModal('SESSION EXPIRING','<p class="muted">Sesi Anda akan berakhir karena tidak ada aktivitas.</p><div style="display:flex;justify-content:flex-end;margin-top:12px"><button class="btn primary" onclick="resetSession();APP.statusPulse=false;closeModal()">TETAP MASUK</button></div>',{eyebrow:'SECURE SESSION'});}if(el){const ss=Math.ceil(left/1000),m=Math.floor(ss/60),sec=ss%60;el.textContent=`${pad(m)}:${pad(sec)}`}}},1000);
setInterval(()=>{if(APP.view==='admin'&&getAdminSection()==='radar'&&APP.session.active)loadAdminLocations()},10000);
window.addEventListener('beforeunload',()=>{try{stopCameraStream();stopRegistrationCapture();stopLocationTracking()}catch(_){}});
window.addEventListener('error',e=>{console.warn('IKSN prototype handled error',e.error||e.message)});
render();
hydrateSession().finally(()=>render());
</script>
</body>
</html>
