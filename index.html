<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<meta name="description" content="IKSN — Secure Information Archive. Prototype lingkungan informasi terbatas fiktif.">
<title>IKSN — Secure Information Archive</title>
<link rel="stylesheet" href="/styles.css">
<style>
/* IKSN rebuild additions — visual language remains the original charcoal/off-white/bronze design. */
@keyframes iksnSealFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes iksnSealRing{0%{transform:rotate(0deg)}50%{transform:rotate(3deg)}100%{transform:rotate(0deg)}}
@keyframes iksnSealGlow{0%,100%{opacity:.72}50%{opacity:1}}
.brand-mark svg,.welcome-logo{animation:iksnSealFloat 5.2s ease-in-out infinite,iksnSealGlow 3.8s ease-in-out infinite}
.welcome-logo{filter:drop-shadow(0 0 14px rgba(176,139,90,.08))}
.iksn-logo-ring{transform-origin:60px 60px;animation:iksnSealRing 8s ease-in-out infinite}
.camera-wrap{min-height:280px}
.camera-wrap video{background:#030303;transform:none!important}
.camera-placeholder{min-height:280px;display:grid;place-items:center;text-align:center;padding:22px}
.face-frame{transition:border-color .25s ease,box-shadow .25s ease}
.face-frame.detected{border-color:#9fc0a7;box-shadow:0 0 0 999px rgba(0,0,0,.05),0 0 22px rgba(134,168,142,.18)}
.verify-item .live-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block;margin-right:7px;animation:pulse 1.8s ease-in-out infinite}
.message-shell{display:grid;grid-template-columns:minmax(220px,.6fr) minmax(0,1.4fr);border:1px solid var(--line);border-radius:16px;overflow:hidden;min-height:560px}
.thread-list{background:#0d0d0d;border-right:1px solid var(--line);overflow:auto}
.thread-item{padding:13px 14px;border:0;border-bottom:1px solid #1b1b1b;background:transparent;color:var(--text);width:100%;text-align:left;display:flex;gap:10px;align-items:center}
.thread-item:hover,.thread-item.active{background:#151515}
.thread-avatar{width:38px;height:38px;border-radius:11px;overflow:hidden;background:#181818;border:1px solid var(--line2);display:grid;place-items:center;flex:none}
.thread-avatar img{width:100%;height:100%;object-fit:cover}
.thread-main{min-width:0;flex:1}.thread-name{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.thread-preview{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}.thread-time{font-size:9px;color:#777;align-self:flex-start}.unread-badge{min-width:18px;height:18px;padding:0 6px;border-radius:999px;background:#e8e2d8;color:#111;display:inline-grid;place-items:center;font-size:9px;font-weight:800}
.chat-panel{min-width:0;display:flex;flex-direction:column;background:#0c0c0c}.chat-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}.chat-messages{flex:1;min-height:0;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:10px}.msg-row{display:flex}.msg-row.mine{justify-content:flex-end}.msg-bubble{max-width:min(78%,520px);padding:10px 12px;border:1px solid var(--line2);border-radius:13px;background:#151515;font-size:12px;line-height:1.5}.msg-row.mine .msg-bubble{background:#19150f;border-color:#4e412f}.msg-meta{margin-top:5px;font-size:9px;color:#7c786f}.chat-compose{padding:12px;border-top:1px solid var(--line);display:flex;gap:8px}.chat-compose textarea{min-height:48px;height:48px;resize:none}.chat-empty{display:grid;place-items:center;height:100%;padding:30px;text-align:center}
.mobile-back{display:none}
.dev-otp{margin-top:10px;padding:9px 11px;border:1px dashed #514732;border-radius:10px;background:#17140f;color:#d3bd91;font-size:11px}.dev-otp b{letter-spacing:.15em}
.location-consent{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px;border:1px solid var(--line);border-radius:12px;background:#111}.switch{position:relative;width:46px;height:26px;flex:none}.switch input{opacity:0;width:0;height:0}.slider{position:absolute;inset:0;border-radius:99px;background:#2a2a2a;border:1px solid #414141;transition:.2s}.slider:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;border-radius:50%;background:#8e8a84;transition:.2s}.switch input:checked+.slider{background:#2d392f;border-color:#506954}.switch input:checked+.slider:before{transform:translateX(20px);background:#b9d4c0}
.radar-dot{cursor:pointer}
@media(max-width:720px){
  .message-shell{grid-template-columns:1fr;min-height:0}.thread-list{border-right:0;border-bottom:1px solid var(--line);max-height:240px}.chat-panel{min-height:480px}.chat-messages{padding:12px}.msg-bubble{max-width:88%}.chat-compose{padding:9px}.camera-wrap{aspect-ratio:3/4;min-height:340px}.camera-placeholder{min-height:340px}.face-frame{width:58%;max-width:220px}.mobile-back{display:inline-flex}
}
@media(prefers-reduced-motion:reduce){.brand-mark svg,.welcome-logo,.iksn-logo-ring{animation:none!important}}
</style>
</head>
<body>
<div id="app" class="app"></div>
<div id="modalRoot"></div>
<script defer src="/app.js"></script>
</body>
</html>
