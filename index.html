<title>IKSN — Secure Information Archive</title>
<style>
:root{
 --bg:#0a0a0a;--panel:#101010;--panel2:#151515;--panel3:#1b1b1b;--line:#282828;--line2:#343434;

}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font);min-height:100%;}body{overflow-x:hidden}
button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:inherit}

/* Brand + common */
.brand{display:flex;gap:14px;align-items:center}.brand-mark{width:46px;height:46px;flex:none}.brand-name{font-weight:700;letter-spacing:.07em;font-size:12px}.brand-sub{font-size:11px;color:var(--muted);margin-top:2px;letter-spacing:.04em}.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:700}.title{font-size:clamp(30px,5vw,52px);line-height:1.02;margin:10px 0 14px;letter-spacing:-.04em}.subtitle{font-size:15px;line-height:1.6;color:var(--muted);max-width:760px}.section-title{font-size:20px;letter-spacing:-.02em;margin:0}.rule{height:1px;background:var(--line);margin:24px 0}.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border:1px solid var(--line2);border-radius:999px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}.chip.success{color:#b9d4c0;border-color:#31533a;background:#132117}.chip.warning{color:#dfc492;border-color:#5e4a27;background:#201a0f}.chip.danger{color:#e5a7ab;border-color:#5a2d31;background:#211214}.chip.info{color:#b7c8d7;border-color:#2e4657;background:#111a20}.chip.neutral{color:#bebbb6;background:#161616}

.input,.select,.textarea{width:100%;border:1px solid var(--line2);background:#0f0f0f;color:var(--text);border-radius:11px;padding:12px 13px;outline:none;transition:border-color .18s,background .18s}.input:focus,.select:focus,.textarea:focus{border-color:#756347;background:#121212}.textarea{min-height:120px;resize:vertical}.label{font-size:12px;font-weight:700;margin-bottom:7px;display:block;color:#d6d2ca}.help{font-size:11px;color:var(--muted);line-height:1.5;margin-top:6px}.field{margin-bottom:15px}.field.inline{display:flex;align-items:center;gap:10px}.check{width:17px;height:17px;accent-color:var(--accent)}

.grid{display:grid;gap:16px}.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}.grid-auto{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}

.welcome{display:grid;place-items:center;min-height:100vh;position:relative;background:radial-gradient(circle at 50% 15%,#171717 0,#0a0a0a 43%,#080808 100%)}.welcome::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(transparent 0 97%,rgba(255,255,255,.02) 100%),radial-gradient(circle at 10% 90%,rgba(176,139,90,.06),transparent 30%)}.welcome-panel{position:relative;z-index:1;width:min(720px,calc(100% - 32px));text-align:center;padding:42px 20px}.welcome-panel .brand{justify-content:center}.welcome-logo{width:98px;height:98px;margin:0 auto 22px}.welcome-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:28px}.welcome-meta{margin-top:36px;border-top:1px solid var(--line);padding-top:18px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px;text-align:left}.meta-cell span{display:block;font-size:10px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}.meta-cell strong{display:block;margin-top:5px;font-size:11px}.mini-link{border:0;background:transparent;color:var(--muted);padding:10px 6px;font-size:12px}.corner-admin{position:fixed;right:14px;bottom:12px;z-index:4;font-size:10px;color:#444;background:none;border:0}.corner-admin:hover{color:#777}
.admin-portal-trigger{display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid #34312c;border-radius:11px;background:#101010;color:#8e887f;letter-spacing:.08em;text-align:left;box-shadow:0 8px 24px rgba(0,0,0,.18)}.admin-portal-trigger:hover{color:#d5c6ad;border-color:#66553c;background:#15130f}.admin-portal-trigger b{display:block;font-size:9px;letter-spacing:.12em}.admin-portal-trigger small{display:block;margin-top:3px;font-size:7px;letter-spacing:.13em;color:#66615a}.admin-portal-mark{width:18px;height:18px;display:grid;place-items:center;color:var(--accent)}.admin-portal-mark .icon{width:16px;height:16px}.admin-security-card{border-color:#4a4032;background:linear-gradient(180deg,#14120f,#10100f)}.admin-security-list{display:grid;gap:8px;margin-top:12px}.admin-security-row{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#111;font-size:11px}.admin-security-row .n{width:22px;height:22px;border:1px solid #4a4032;border-radius:50%;display:grid;place-items:center;color:var(--accent);font-size:9px;font-weight:700}.admin-auth-code{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}.admin-auth-code input{text-align:center;font-size:22px;font-weight:700;padding:12px 4px;width:100%;min-width:0}.admin-auth-note{font-size:10px;color:#77736d;line-height:1.55}.admin-sidebar-section{margin-top:18px}.admin-sidebar-title{font-size:9px;letter-spacing:.14em;color:#595651;text-transform:uppercase;padding:0 10px;margin-bottom:6px}
/* Auth */
.auth-shell{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr}.auth-aside{padding:40px;display:flex;flex-direction:column;justify-content:space-between;border-right:1px solid var(--line);background:linear-gradient(160deg,#0c0c0c,#090909)}.auth-main{display:grid;place-items:center;padding:36px}.auth-box{width:min(560px,100%)}.auth-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.stepper{display:flex;gap:8px;flex-wrap:wrap}.step{display:flex;align-items:center;gap:7px;font-size:10px;color:#666;letter-spacing:.1em;text-transform:uppercase}.step .n{width:22px;height:22px;border:1px solid #343434;border-radius:50%;display:grid;place-items:center}.step.active{color:var(--text)}.step.active .n{border-color:var(--accent);color:var(--accent)}.step.done .n{background:#d9d2c4;color:#111;border-color:#d9d2c4}.auth-header{margin-bottom:22px}.otp{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;width:100%}.otp input{text-align:center;font-size:22px;font-weight:700;padding:12px 4px;width:100%;min-width:0;box-sizing:border-box}.password-wrap{position:relative}.password-toggle{position:absolute;right:8px;top:8px;border:0;background:none;color:var(--muted);padding:8px}.device-check{display:grid;grid-template-columns:1.1fr .9fr;gap:14px}.status-list{display:grid;gap:8px}.status-row{display:flex;justify-content:space-between;gap:18px;padding:9px 0;border-bottom:1px solid #202020;font-size:12px}.status-row:last-child{border-bottom:0}.status-row span:first-child{color:var(--muted)}

.camera-wrap{position:relative;aspect-ratio:4/3;background:#070707;border:1px solid var(--line2);border-radius:18px;overflow:hidden;display:grid;place-items:center}.camera-wrap video{width:100%;height:100%;object-fit:cover;background:#050505}.face-frame{position:absolute;width:56%;max-width:280px;aspect-ratio:.75;border:1px solid rgba(232,224,211,.55);border-radius:45% 45% 42% 42% / 40% 40% 48% 48%;box-shadow:0 0 0 999px rgba(0,0,0,.06);pointer-events:none}.camera-state{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}.camera-bottom{position:absolute;left:12px;right:12px;bottom:12px;display:flex;justify-content:space-between;gap:8px;align-items:end}.camera-hud{background:rgba(8,8,8,.82);backdrop-filter:blur(8px);border:1px solid #303030;border-radius:10px;padding:8px 10px;font-size:10px}.demo-strip{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding:10px 12px;border:1px dashed #50493f;background:#17140f;border-radius:10px}.verify-list{display:grid;gap:8px;margin-top:16px}.verify-item{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:#111;border:1px solid var(--line);border-radius:10px;font-size:12px}.verify-item b{font-size:11px}.verify-item.ok b{color:#bad1bf}.verify-item.wait b{color:#cbb888}.verify-item.bad b{color:#e1a5a8}

.shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}.sidebar{border-right:1px solid var(--line);background:#0c0c0c;padding:18px 14px;position:sticky;top:0;height:100vh;overflow:auto}.side-nav{margin-top:22px}.side-group{margin-top:18px}.side-label{font-size:9px;letter-spacing:.14em;color:#595651;text-transform:uppercase;padding:0 10px;margin-bottom:6px}.nav-btn{width:100%;border:0;background:none;color:#a9a6a0;text-align:left;padding:10px;border-radius:9px;display:flex;gap:10px;align-items:center;font-size:12px}.nav-btn:hover,.nav-btn.active{background:#171717;color:var(--text)}.nav-btn .icon{width:16px;height:16px}.sidebar-footer{margin-top:26px;padding:12px 10px;border-top:1px solid var(--line);font-size:10px;line-height:1.5;color:#6e6b66}.main{min-width:0}.topbar{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;background:rgba(10,10,10,.92);backdrop-filter:blur(12px);z-index:8}.mobile-menu{display:none}.top-actions{display:flex;gap:8px;align-items:center}.profile-mini{display:flex;gap:8px;align-items:center}.avatar{width:34px;height:34px;border-radius:10px;border:1px solid var(--line2);display:grid;place-items:center;background:#191919;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.avatar .initials{font-size:11px;font-weight:700}.clearance-dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}.page{padding:28px}.page-head{display:flex;justify-content:space-between;gap:16px;align-items:end;margin-bottom:22px}.page-head .actions{display:flex;gap:8px;flex-wrap:wrap}.panel-grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(290px,.85fr);gap:16px}.stack{display:grid;gap:16px}.quick-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.notice{padding:12px 13px;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;background:#111;font-size:12px;line-height:1.5}.notice.danger{border-left-color:var(--danger)}.notice.success{border-left-color:var(--success)}

.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.toolbar .grow{flex:1;min-width:220px}.table-wrap{border:1px solid var(--line);border-radius:14px;overflow:hidden}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{padding:12px 13px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}.table th{font-size:9px;letter-spacing:.12em;color:#77736d;text-transform:uppercase;background:#111}.table tr:hover td{background:#121212}.table tr:last-child td{border-bottom:0}.table .primary-cell{font-weight:700}.result-card{display:none}.pagination{display:flex;justify-content:space-between;align-items:center;margin-top:12px;color:var(--muted);font-size:11px}.pager{display:flex;gap:5px}.pager button{background:#141414;border:1px solid var(--line);color:var(--muted);min-width:34px;height:32px;border-radius:8px}.pager button.active{background:#e8e2d8;color:#111;border-color:#e8e2d8}

.detail-head{display:flex;align-items:center;gap:15px}.detail-photo{width:92px;height:108px;border-radius:14px;border:1px solid var(--line2);overflow:hidden;background:#1a1a1a;display:grid;place-items:center;flex:none}.detail-photo img{width:100%;height:100%;object-fit:cover}.detail-meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 24px}.meta-box{padding:11px 0;border-bottom:1px solid var(--line)}.meta-box .k{font-size:9px;color:#77736d;letter-spacing:.1em;text-transform:uppercase}.meta-box .v{font-size:12px;margin-top:4px}.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.68);backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px;z-index:30}.modal{width:min(980px,100%);max-height:92vh;overflow:auto;background:#0e0e0e;border:1px solid #363636;border-radius:18px;box-shadow:var(--shadow)}.modal-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:15px}.modal-body{padding:18px}.close-btn{width:36px;height:36px;border:1px solid var(--line);background:#151515;color:var(--muted);border-radius:10px}.viewer{position:relative}.watermark{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font-size:38px;font-weight:800;letter-spacing:.2em;color:rgba(255,255,255,.025);transform:rotate(-20deg)}.doc-content{max-width:780px;margin:auto;line-height:1.75;color:#cfcbc4}.doc-content h3{font-size:16px;color:var(--text);margin-top:26px}.doc-meta-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:18px}.doc-meta-card{padding:11px;border:1px solid var(--line);border-radius:10px;background:#111}.doc-meta-card .k{font-size:9px;color:#777;text-transform:uppercase}.doc-meta-card .v{font-size:12px;margin-top:5px}

.radar-layout{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(330px,.9fr);gap:16px}.radar{aspect-ratio:1/1;background:radial-gradient(circle,#141414 0 42%,#101010 43% 70%,#0d0d0d 71%);border:1px solid var(--line2);border-radius:50%;position:relative;overflow:hidden;max-width:640px;margin:auto}.radar::before,.radar::after{content:"";position:absolute;inset:10%;border:1px solid rgba(176,139,90,.16);border-radius:50%}.radar::after{inset:25%}.radar-line{position:absolute;left:50%;top:50%;width:50%;height:1px;background:linear-gradient(90deg,rgba(176,139,90,.0),rgba(176,139,90,.5));transform-origin:left center;transform:rotate(-32deg)}.radar-v,.radar-h{position:absolute;left:50%;top:8%;bottom:8%;width:1px;background:rgba(176,139,90,.11);transform:translateX(-50%)}.radar-h{top:50%;left:8%;right:8%;bottom:auto;width:auto;height:1px;transform:none}.radar-core{position:absolute;width:8px;height:8px;background:var(--accent);border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%);animation:radarPulse 2.2s infinite}.radar-dot{position:absolute;width:9px;height:9px;border-radius:50%;background:#b18e61;box-shadow:0 0 0 4px rgba(176,139,90,.09)}.radar-dot.off{background:#555;box-shadow:none}.radar-dot.warn{background:#a8655d}.personnel-list{display:grid;gap:9px;max-height:660px;overflow:auto}.person-card{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:11px;border:1px solid var(--line);border-radius:12px;background:#111}.person-card .p-avatar{width:40px;height:40px;border-radius:10px;overflow:hidden;background:#181818;border:1px solid #2c2c2c}.p-avatar img{width:100%;height:100%;object-fit:cover}.person-card .name{font-size:12px;font-weight:700}.person-card .meta{font-size:10px;color:var(--muted);margin-top:2px}.coords{font-family:ui-monospace,monospace;font-size:9px;color:#b6a385}.radar-blink{animation:pulse 1.8s infinite}.battery{height:5px;background:#242424;border-radius:99px;margin-top:4px;overflow:hidden}.battery span{display:block;height:100%;background:#90805e}

async function startCamera(purpose){stopFaceScan();if(APP.camera.stream)stopCameraStream();APP.camera.purpose=purpose;APP.camera.state='requesting';APP.camera.verification='waiting';renderCameraState();if(!window.isSecureContext&&!['localhost','127.0.0.1'].includes(location.hostname)){APP.camera.state='insecure';APP.camera.error='insecure';renderCameraState();return}if(!navigator.mediaDevices?.getUserMedia){APP.camera.state='error';APP.camera.error='unsupported';renderCameraState();return}try{const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'user'},width:{ideal:720},height:{ideal:540}},audio:false});APP.camera.stream=stream;APP.camera.state='active';APP.camera.error=null;APP.camera.verification='waiting';renderCameraState();setTimeout(attachCameraVideo,40)}catch(e){APP.camera.state='error';APP.camera.error=e?.name||'unknown';renderCameraState()}}

function cameraUI(purpose){if(APP.camera.state==='requesting')return `<div class="camera-wrap"><div class="camera-hud">MEMINTA AKSES KAMERA</div><div style="text-align:center;padding:16px"><div class="eyebrow">Meminta Akses Kamera</div><p class="muted" style="font-size:12px">Silakan izinkan akses kamera melalui pemberitahuan browser.</p></div></div>`;if(APP.camera.state==='insecure')return `<div class="notice danger"><b>KONEKSI AMAN DIPERLUKAN</b><p>Browser membatasi akses kamera pada lingkungan yang tidak dianggap aman. Jalankan prototype melalui HTTPS atau localhost untuk menggunakan kamera.</p></div><div class="help" style="margin-top:10px">Fitur kamera browser dapat memerlukan HTTPS atau localhost tergantung pada browser dan perangkat.</div>`;if(APP.camera.state==='error'){const title=APP.camera.error==='unsupported'?'KAMERA TIDAK TERSEDIA':APP.camera.error==='NotAllowedError'?'AKSES KAMERA DITOLAK':'KAMERA TIDAK DAPAT DIGUNAKAN';return `<div class="notice danger"><b>${title}</b><p>${humanCameraError(APP.camera.error)}</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn small" onclick="startCamera('${purpose}')">COBA LAGI</button><button class="btn small" onclick="showCameraHelp()">CARA MENGIZINKAN KAMERA</button></div></div>`}if(APP.camera.state==='active')return `<div class="camera-wrap"><video id="camVideo" autoplay playsinline muted></video><div class="face-frame"></div><div class="camera-state"><span class="chip success">KAMERA AKTIF</span><span class="chip neutral">REAL CAMERA</span></div><div class="camera-bottom"><div class="camera-hud"><b>VERIFIKASI WAJAH</b><br><span class="muted">${APP.camera.verification==='waiting'?'Menunggu wajah — arahkan wajah ke bingkai':APP.camera.verification==='detected'?'Wajah terdeteksi — pertahankan posisi':'Verifikasi berlangsung'}</span></div></div></div>${verificationPanel(purpose)}`;return cameraPermissionIntro(purpose)}
function verificationPanel(purpose){const v=APP.camera.verification;return `<div class="verify-list"><div class="verify-item ${['detected','processing','done'].includes(v)?'ok':'wait'}"><span>Wajah terdeteksi</span><b>${v==='waiting'?'MENUNGGU':v==='bad'?'GAGAL':'OK'}</b></div><div class="verify-item ${['processing','done'].includes(v)?'ok':'wait'}"><span>Posisi wajah sesuai</span><b>${v==='processing'||v==='done'?'OK':'MENUNGGU'}</b></div><div class="verify-item ${['processing','done'].includes(v)?'ok':'wait'}"><span>Pencahayaan cukup</span><b>${v==='processing'||v==='done'?'DIPERIKSA':'MENUNGGU'}</b></div><div class="verify-item ${v==='done'?'ok':'wait'}"><span>Status identitas</span><b>${v==='done'?'TERKONFIRMASI':v==='processing'?'VERIFIKASI BERLANGSUNG':'MENUNGGU'}</b></div>${v==='done'?`<button class="btn primary block" onclick="finishBiometric('${purpose}')">LANJUTKAN</button>`:''}<div class="help">Jangan meninggalkan area wajah sampai status verifikasi selesai.</div></div>`}
function startFaceScan(video){
 stopFaceScan();
 APP.camera.stableFrames=0;
 const detector=window.FaceDetector?new window.FaceDetector({fastMode:true,maxDetectedFaces:1}):null;
 const sample=async()=>{
  if(APP.camera.state!=='active'||!APP.camera.stream)return;
  if(video.readyState<2){APP.camera.scanRAF=requestAnimationFrame(sample);return}
  let detected=false;
  try{
   if(detector){detected=(await detector.detect(video)).length>0}
   else{detected=facePresenceHeuristic(video)}
  }catch(_){detected=false}
  if(detected){APP.camera.stableFrames++;}else{APP.camera.stableFrames=0;}
  // Require several consecutive positive frames so the camera cannot finish immediately on entry.
  if(APP.camera.verification==='waiting' && APP.camera.stableFrames>=45){
   APP.camera.verification='detected';
   renderVerificationSteps();
   APP.camera.scanTimer=setTimeout(beginBiometricProcessing,1800);
   return;
  }
  APP.camera.scanRAF=requestAnimationFrame(sample);
 };
 APP.camera.scanRAF=requestAnimationFrame(sample);
}
function facePresenceHeuristic(video){
 const c=document.createElement('canvas');c.width=120;c.height=90;
 const ctx=c.getContext('2d',{willReadFrequently:true});if(!ctx)return false;
 ctx.drawImage(video,0,0,120,90);
 const d=ctx.getImageData(32,12,56,66).data;
 let skin=0,bright=0,total=d.length/4;
 for(let i=0;i<d.length;i+=4){
  const r=d[i],g=d[i+1],b=d[i+2];
  if(r>80&&g>45&&b>25&&r>g*1.04&&g>b*1.06)skin++;
  if((r+g+b)/3>60)bright++;
 }
 return skin/total>.12&&bright/total>.6;
}

function requestRealLocation(){if(!navigator.geolocation){toast('Browser ini tidak mendukung layanan lokasi.','danger');return}if(!window.isSecureContext&&!['localhost','127.0.0.1'].includes(location.hostname)){toast('Lokasi browser memerlukan HTTPS atau localhost pada sebagian browser.','danger');return}navigator.geolocation.getCurrentPosition(p=>{applyLocation(p);if(APP.location.watchId===null)APP.location.watchId=navigator.geolocation.watchPosition(applyLocation,locationError,{enableHighAccuracy:true,maximumAge:10000,timeout:15000});closeModal();toast('Transmisi lokasi aktif. Posisi aktual perangkat sedang diperbarui.','success');refreshDeviceSignals()},locationError,{enableHighAccuracy:true,maximumAge:0,timeout:15000})}

function saveRegPersonal(){
 const get=id=>{const el=document.getElementById(id);return String(el?.value??'').trim()};
 const vals={name:get('rName'),nick:get('rNick'),dob:get('rDob'),country:get('rCountry'),province:get('rProvince'),city:get('rCity'),phone:get('rPhone'),email:get('rEmail').toLowerCase(),alt:get('rAlt').toLowerCase()};
 const required=[['name','Nama Lengkap'],['dob','Tanggal Lahir'],['country','Negara'],['province','Provinsi'],['city','Kota'],['phone','Nomor Telepon'],['email','Email Utama']];
 const missing=required.find(([k])=>vals[k]==='');
 if(missing){const el=document.getElementById('r'+missing[0].charAt(0).toUpperCase()+missing[0].slice(1));if(el)el.focus();toast(`Kolom ${missing[1]} wajib diisi.`,'danger');return}
 const emailRx=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
 if(!emailRx.test(vals.email)){document.getElementById('rEmail')?.focus();toast('Email Utama belum menggunakan format yang valid. Contoh: nama@email.com.','danger');return}
 if(vals.alt&&!emailRx.test(vals.alt)){document.getElementById('rAlt')?.focus();toast('Email Alternatif belum menggunakan format yang valid.','danger');return}
 if(vals.phone.replace(/\D/g,'').length<6){document.getElementById('rPhone')?.focus();toast('Nomor Telepon terlalu pendek.','danger');return}
 APP.registration.data={...APP.registration.data,...vals};APP.registration.step=2;render();
}
